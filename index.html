<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>現場收款</title>
<style>
/* 2026：白底、大字、細線、單一黑色主色＋狀態色，浮層才用霧面玻璃 */
:root{color-scheme:light;
  --bg:#fff;--ink:#0a0a0a;--ink2:#71717a;--ink3:#a1a1aa;--line:#ececee;--line2:#e4e4e7;--soft:#f4f4f5;--soft2:#fafafa;
  --green:#16a34a;--greenS:#f0fdf4;--greenL:#bbf7d0;--red:#dc2626;--redS:#fef2f2;--amber:#f59e0b;
  --z1:#2563eb;--z2:#e11d48;--z3:#0d9488;--z4:#ea580c;--z5:#7c3aed;--z0:#0a0a0a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sans:"Geist","Inter",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.demo{background:var(--ink);color:#fff;text-align:center;font-size:12px;font-weight:500;padding:6px;letter-spacing:.02em}
.c1{--c:var(--z1)}.c2{--c:var(--z2)}.c3{--c:var(--z3)}.c4{--c:var(--z4)}.c5{--c:var(--z5)}.c0{--c:var(--z0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 登入 ---------- */
#login{min-height:100vh;padding:calc(64px + var(--st)) 0 48px}
#login .wrap{max-width:440px}
.lg-h{margin-bottom:36px}
.lg-h small{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:500;border:1px solid var(--line2);border-radius:999px;padding:4px 12px 4px 10px}
.lg-h small::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--greenL)}
.lg-h h1{margin:18px 0 6px;font-size:40px;font-weight:650;letter-spacing:-.035em;line-height:1.05}
.lg-h p{margin:0;color:var(--ink2);font-size:16px}
.cap{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:0 2px 10px}
.group{display:grid;gap:8px;margin-bottom:28px}
.zb{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;border:1px solid var(--line2);border-radius:16px;background:#fff;transition:border-color .15s,background .15s,transform .1s}
.zb:hover{border-color:var(--ink3)}.zb:active{transform:scale(.99);background:var(--soft2)}
.zi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:600 15px var(--mono);flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.c0 .zi,.zi.c0{background:var(--ink);color:#fff}
.zb .zn{flex:1;font-size:16px;font-weight:550}
.zb::after{content:"";width:7px;height:7px;border-top:1.5px solid var(--ink3);border-right:1.5px solid var(--ink3);transform:rotate(45deg);margin-right:4px}

/* 密碼 */
#pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(16px + var(--st)) 24px calc(28px + var(--sb))}
.pin-top{width:100%;max-width:360px}
.back{color:var(--ink2);font-size:15px;font-weight:500;padding:8px 0}
.pin-h{text-align:center;margin:28px 0 4px}
.pin-h .zi{width:48px;height:48px;border-radius:14px;font-size:20px;margin:0 auto 16px}
.pin-h b{display:block;font-size:24px;font-weight:650;letter-spacing:-.03em}
.pin-h small{display:block;color:var(--ink2);font-size:14px;margin-top:6px}
.dots{display:flex;justify-content:center;gap:18px;margin:28px 0 10px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line2);transition:background .15s,transform .15s}
.dots i.f{background:var(--ink);transform:scale(1.08)}
.dots.shake{animation:sh .38s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.err{color:var(--red);text-align:center;min-height:20px;font-size:13.5px;margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 28px;justify-content:center}
.pad button{width:76px;height:76px;border-radius:50%;background:var(--soft);font:400 28px var(--mono);display:grid;place-items:center;transition:background .1s}
.pad button:active{background:var(--line2)}
.pad button.k0{grid-column:2}
.pad button.del{background:none;font:500 14px var(--sans);color:var(--ink2)}
.who{display:block;width:100%;max-width:300px;margin:26px auto 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:15px;text-align:center;outline:none}
.who:focus{border-color:var(--ink)}
.who::placeholder{color:var(--ink3)}

/* ---------- 主畫面 ---------- */
.top{padding:calc(12px + var(--st)) 0 4px}
.nav{display:flex;align-items:center;gap:12px;min-height:36px}
.nav .sp{flex:1}
.nb{color:var(--ink2);font-size:15px;font-weight:500}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:4px 11px 4px 9px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sync.busy{color:#b45309;border-color:#fde68a;background:#fffbeb}.sync.busy i{background:var(--amber);animation:pl 1s infinite}
.sync.off{color:var(--red);border-color:#fecaca;background:var(--redS)}.sync.off i{background:var(--red)}
@keyframes pl{50%{opacity:.25}}
.title{margin:14px 0 0}
.title h1{margin:0;font-size:32px;font-weight:650;letter-spacing:-.035em;line-height:1.1}
.sum{margin:18px 0 6px}
.sum .t{display:flex;align-items:baseline;gap:8px}
.sum .t b{font:600 34px var(--mono);letter-spacing:-.04em;line-height:1}
.sum .t span{color:var(--ink2);font-size:14px}
.sum .t em{margin-left:auto;font:500 14px var(--mono);color:var(--ink2);font-style:normal}
.prog{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

.bar{position:sticky;top:0;z-index:20;padding:12px 0;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);transition:box-shadow .2s}
.bar.sh{box-shadow:0 1px 0 var(--line)}
.srow{display:flex;gap:12px;align-items:center}
.q{flex:1;position:relative}
.q svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink3)}
.q input{width:100%;height:40px;padding:0 34px 0 36px;border-radius:12px;border:1px solid transparent;background:var(--soft);font-size:16px;outline:none;transition:border-color .15s,background .15s}
.q input:focus{background:#fff;border-color:var(--ink)}
.q input::placeholder{color:var(--ink3)}
.q input::-webkit-search-cancel-button{display:none}
.q button{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--ink3);color:#fff;font-size:11px;line-height:20px}
.sortb,#undoB{font-size:14px;font-weight:550;color:var(--ink);white-space:nowrap;height:40px;padding:0 2px}
#undoB{color:var(--ink2)}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04)}
.seg button small{font:500 12px var(--mono);color:var(--ink3);margin-left:6px}
.seg button.on small{color:var(--ink2)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--ink2)}
.chips button i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}

main{padding:0 0 calc(120px + var(--sb))}
.lst{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);animation:in .25s ease-out both}
@keyframes in{from{opacity:0}}
.no{width:26px;flex:none;font:500 13px var(--mono);color:var(--ink3);align-self:flex-start;padding-top:3px}
.no .zd{display:block;margin-top:7px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.nm{flex:1;min-width:0}
.nm .n1{font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.nm .n1 .f{font-weight:400;margin-right:7px}
.nm .ig{font-size:14px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.pend{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:7px;vertical-align:middle;animation:pl 1s infinite}
.grp{margin-top:8px;font-size:13px;font-weight:550;color:var(--ink);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:4px 11px}
.grp::after{content:"→";color:var(--ink2);font-weight:400}
.grp:active{background:var(--soft)}
.tb{flex:none;width:46px;height:46px;border:1px solid var(--line2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:#fff}
.tb b{font:600 18px var(--mono);letter-spacing:-.03em}
.tb small{font-size:9.5px;color:var(--ink3);margin-top:3px;font-weight:500}
.tb.na{border-style:dashed}.tb.na b{font:500 12px var(--sans);color:var(--ink3)}
.pb{flex:none;width:92px;height:38px;border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:transform .1s,background .2s,border-color .2s,color .2s}
.pb::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.pb:active{transform:scale(.96)}
.pb.ok{background:var(--green);border-color:var(--green);color:#fff}
.pb.ok::before{width:9px;height:5px;border-radius:0;background:none;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.pb.conf{background:var(--ink);border-color:var(--ink);color:#fff;font-size:12.5px;line-height:1.15}
.pb.conf::before{display:none}
.pb.none{color:var(--ink2)}.pb.none::before{background:var(--ink3)}
.empty{text-align:center;color:var(--ink2);padding:72px 0;font-size:15px}
.empty b{display:block;font-size:20px;color:var(--ink);font-weight:650;letter-spacing:-.02em;margin-bottom:6px}
@media (max-width:374px){.wrap{padding:0 16px}.pb{width:84px;font-size:13px}.tb{width:42px;height:42px}.row{gap:11px}}

/* 浮層：霧面玻璃 */
.undo{position:fixed;left:50%;bottom:calc(18px + var(--sb));transform:translateX(-50%);z-index:40;width:min(500px,calc(100vw - 24px));background:rgba(10,10,10,.88);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);color:#fff;border-radius:18px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.undo span{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere;padding:9px 0}
.undo button{flex:none;background:#fff;color:var(--ink);font-weight:650;font-size:14px;padding:9px 16px;border-radius:12px}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translateX(-50%);background:rgba(10,10,10,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:70;max-width:calc(100vw - 32px);text-align:center;animation:fd .2s}

/* 整筆確認 */
.mask{position:fixed;inset:0;background:rgba(10,10,10,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:#fff;width:min(560px,100vw);max-height:90vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sb);animation:sl .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.08)}
@keyframes sl{from{transform:translateY(30%);opacity:.4}}
@media (min-width:700px){.mask{align-items:center}.sheet{border-radius:24px}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
.sh-h{padding:18px 24px 6px}
.sh-h h3{margin:0;font-size:20px;font-weight:650;letter-spacing:-.03em}
.sh-h p{margin:4px 0 0;color:var(--ink2);font-size:13.5px}
.sh-l{overflow:auto;margin:8px 24px 0;border-top:1px solid var(--line)}
.it{display:flex;align-items:center;gap:13px;padding:13px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.it.on .ck{background:var(--ink);border-color:var(--ink)}
.it.on .ck::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.it.dis{cursor:default}
.it.dis .ck{border-color:var(--greenL);background:var(--greenS)}
.it.dis .ck::after{content:"";width:9px;height:4px;border:solid var(--green);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.it .nm .n1{font-size:15.5px}
.it .amt{font:500 14px var(--mono);color:var(--ink);white-space:nowrap}
.it .paid{font-size:13px;color:var(--green);font-weight:600;white-space:nowrap}
.it .tb{width:40px;height:40px;border-radius:10px}.it .tb b{font-size:15px}
.sh-t{display:flex;justify-content:space-between;align-items:baseline;margin:16px 24px 0;font-size:14px;color:var(--ink2)}
.sh-t b{font:600 26px var(--mono);color:var(--ink);letter-spacing:-.04em}
.sh-f{display:flex;gap:10px;padding:16px 24px 20px}
.sh-f button{flex:1;height:52px;border-radius:14px;font-weight:600;font-size:16px}
.sh-f .cx{background:var(--soft);color:var(--ink)}
.sh-f .go{background:var(--ink);color:#fff;flex:2}
.sh-f .go:disabled{opacity:.25}

/* 管理者統計：便當盒格線 */
.h3{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:28px 2px 10px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line2);border-radius:16px;padding:14px 14px 12px;min-width:0}
.tile small{display:block;font-size:12.5px;color:var(--ink2);font-weight:500}
.tile b{display:block;font:600 26px var(--mono);letter-spacing:-.04em;margin-top:6px;line-height:1.05;overflow-wrap:anywhere}
.tile.m b{font-size:18px}
.tile.g b{color:var(--green)}.tile.r b{color:var(--red)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:16px}
.tile.wide .prog{flex:1;margin:0;height:6px;border-radius:3px}
.card{border:1px solid var(--line2);border-radius:16px;padding:4px 16px}
.zrow{padding:14px 0}
.zrow+.zrow{border-top:1px solid var(--line)}
.zrow .a{display:flex;align-items:center;gap:12px}
.zrow .a .zi{width:28px;height:28px;border-radius:8px;font-size:13px}
.zrow .a .zn{flex:1;font-weight:550;font-size:15px}
.zrow .a b{font:600 15px var(--mono)}
.zrow .prog{margin:10px 0 7px 40px;height:4px}
.zrow .s{margin-left:40px;font-size:12.5px;color:var(--ink2)}
.zrow .s span{font-family:var(--mono)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:11px 0 11px 10px;text-align:right;white-space:nowrap}
td{font-family:var(--mono);letter-spacing:-.02em}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal;font-family:var(--sans);letter-spacing:0}
th{font-size:12px;color:var(--ink3);font-weight:500;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
td.g{color:var(--green)}td.r{color:var(--red)}
.tblw{overflow-x:auto}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:14px;padding:12px 0;font-size:14.5px}
.feed li+li{border-top:1px solid var(--line)}
.feed time{color:var(--ink3);flex:none;font:500 12.5px var(--mono);width:84px;padding-top:2px}
.feed span{flex:1;min-width:0}
.feed small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.feed .g{color:var(--green)}.feed .r{color:var(--red)}
.muted{color:var(--ink2);font-size:14px;padding:14px 0}

/* v6 */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,input,.row{touch-action:manipulation}
.lgtop{display:flex;margin:-36px 0 28px}.lgtop .sp,.nav .sp{flex:1}
.lang{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2)}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lang.sm button{height:24px;padding:0 9px;font-size:12px}
.who{font-size:16px}
.lh{display:flex;align-items:center;gap:14px;padding:0 0 8px;font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.lh .c-no{width:34px;text-align:center}.lh .c-nm{flex:1}.lh .c-t{width:48px;text-align:center}.lh .c-p{width:96px;text-align:center}
.no{width:34px;height:30px;flex:none;align-self:flex-start;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 15px var(--mono);color:var(--ink);background:var(--soft);border-radius:9px;padding:0;letter-spacing:-.03em}
.no .zd{margin:0;position:absolute;width:6px;height:6px;border-radius:50%;background:var(--c);transform:translate(15px,-13px)}
.no{position:relative}
.tb{width:48px;height:48px;border:2px solid var(--ink);border-radius:13px}
.tb b{font:700 21px var(--mono);letter-spacing:-.04em}
.tb.na{border:1.5px dashed var(--ink3)}.tb.na b{font:600 12px var(--sans);color:var(--ink2)}
.pb{width:96px}
.pb.cfp{background:var(--green);border-color:var(--green);color:#fff;animation:pulse 1s ease-in-out infinite}
.pb.cfp::before{display:none}
.pb.cfu{background:var(--ink);border-color:var(--ink);color:#fff;font-size:13px}
.pb.cfu::before{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--green) 22%,transparent)}}
.row.arm{background:linear-gradient(90deg,transparent,var(--greenS) 40%,var(--greenS))}
a.ig{display:block;color:var(--ink2);text-decoration:none;width:max-content;max-width:100%}
a.ig:hover,a.ig:active{color:var(--z1);text-decoration:underline}
a.ig::after{content:"↗";font-size:11px;margin-left:3px;color:var(--ink3)}
.histb{font-size:14px;font-weight:550;color:var(--ink);white-space:nowrap;height:40px;padding:0 2px}
.it .ino{font:700 13px var(--mono);width:28px;text-align:center;color:var(--ink);background:var(--soft);border-radius:7px;padding:4px 0;flex:none}

const flag=c=>{c=String(c||'').toUpperCase();if(c==='UK')c='GB';return /^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'🏳️'};
const money=n=>'NT$'+Number(n||0).toLocaleString('en-US');
const tHue=n=>{let h=((Number(n)||0)*137.508)%360*280/360;if(h>=95)h+=80;return Math.round(h)}; // 黃金角讓相鄰桌號顏色差最多；跳過綠色，避免跟「已收款」搞混
const igUrl=h=>{const u=String(h||'').trim().replace(/^@+/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[/?#].*$/,'');return /^[A-Za-z0-9._]{1,30}$/.test(u)?'https://www.instagram.com/'+u+'/':''};

/* ===== 中英文 ===== */

const ZN={zh:{1:'台灣區',2:'日本區',3:'美洲與大洋洲區',4:'港星馬中（華語圈）',5:'韓國、歐洲與東南亞區',0:'管理者'},en:{1:'Taiwan',2:'Japan',3:'Americas & Oceania',4:'HK · SG · MY · CN',5:'Korea, Europe & SE Asia',0:'Admin'}};
const ZS={zh:{1:'台灣',2:'日本',3:'美洲大洋洲',4:'港星馬中',5:'韓歐東南亞'},en:{1:'Taiwan',2:'Japan',3:'Americas',4:'HK/SG/MY/CN',5:'KR/EU/SEA'}};
const CN={TW:'台灣',JP:'日本',KR:'韓國',HK:'香港',CN:'中國',US:'美國',AU:'澳洲',SG:'新加坡',MY:'馬來西亞',TH:'泰國',PH:'菲律賓',ID:'印尼',VN:'越南',MO:'澳門',GB:'英國',UK:'英國',CA:'加拿大',FR:'法國',DE:'德國',ES:'西班牙',NL:'荷蘭',BR:'巴西',MN:'蒙古',NZ:'紐西蘭',CL:'智利',MX:'墨西哥',IN:'印度',IT:'義大利'};
let DN=null;try{DN=new Intl.DisplayNames(['en'],{type:'region'})}catch(e){}
const cname=c=>{c=String(c||'').toUpperCase();if(LANG==='en'){try{return DN?DN.of(c==='UK'?'GB':c):c}catch(e){return c}}return CN[c]||c};
const T={
 zh:{demo:'示範模式 · 資料是假的，不會寫入雲端',title:'現場收款',intro:'選擇你負責的區域，輸入密碼開始收款。',pickZone:'選擇區域',back:'‹ 返回',pin4:'輸入 4 位數密碼',who:'你的名字（選填）',logout:'‹ 登出',
  tabStat:'統計',tabList:'名單',search:'編號、姓名、IG、桌號',undo:'復原',cancel:'取消',del:'刪除',
  synced:'已同步',uploading:'{n} 筆上傳中',offline:'離線',offlineN:'離線 · {n} 筆待上傳',loggingIn:'登入中…',
  sortN:'依編號',sortT:'依桌號',hist:'紀錄',histN:'紀錄 {n}',
  fTodo:'未收款',fDone:'已收款',fAll:'全部',all:'全部',
  sum:'/ {n} 人已收款',colNo:'編號',colName:'姓名 · IG',colT:'桌號',colPay:'款項',
  unpaid:'未收款',paid:'已收款',unset:'未設定',confirmPay:'確認收款',confirmUnpay:'改回未收？',
  group:'整筆 {n} 人',tbd:'待排',
  emptyQ:'找不到結果',emptyQ2:'沒有符合「{q}」的人',emptyTodo:'全部收完了',emptyTodo2:'這個篩選裡沒有未收款的人',emptyNone:'沒有資料',
  grpTitle:'{reg} · 整筆 {n} 人',grpHint:'請核對名單，勾選的人會改成「已收款」',thisDue:'本次應收',grpGo:'確認 {n} 人已收款',grpPick:'請勾選要收款的人',
  lPay:'{name} 已收款',lUnpay:'{name} 改回未收款',lGrp:'{reg} 整筆 {n} 人已收款',undone:'已復原 · {l}',noUndo:'沒有可以復原的操作',
  histTitle:'我的操作紀錄',histHint:'每一筆都可以單獨復原（只會改回這支手機改過的人）',histEmpty:'還沒有操作',histDone:'已復原',histClose:'關閉',histChanged:'已被改過，略過 {n} 人',
  logoutQ:'確定登出？',logoutPend:'還有 {n} 筆還沒上傳完成，確定登出？',
  ovAll:'總覽 · {n} 人',kPaid:'已收款',kUnpaid:'未收款',kTotal:'總人數',kPaidAmt:'已收金額',kDueAmt:'待收金額',kAllAmt:'應收總額',
  zones:'各區',zs:'{p}% · 未收 {u} 人 · 待收 {d}',pm:'付款方式',pmh:['方式','人數','已收','未收','待收金額'],noPm:'（未填）',ct:'國家／地區',cth:['國家','人數','已收','未收'],
  coll:'收款人',collh:['區域・收款人','處理人數','收到金額'],recent:'最近更新',noRecent:'還沒有人在現場改過款項狀態',zoneN:'{z} 區'},
 en:{demo:'Demo mode · sample data, nothing is saved',title:'Payment Check-in',intro:'Choose your zone and enter the passcode to start.',pickZone:'Zones',back:'‹ Back',pin4:'Enter 4-digit passcode',who:'Your name (optional)',logout:'‹ Log out',
  tabStat:'Overview',tabList:'Guests',search:'No., name, IG, table',undo:'Undo',cancel:'Cancel',del:'Delete',
  synced:'Synced',uploading:'Uploading {n}',offline:'Offline',offlineN:'Offline · {n} queued',loggingIn:'Signing in…',
  sortN:'By No.',sortT:'By table',hist:'History',histN:'History {n}',
  fTodo:'Unpaid',fDone:'Paid',fAll:'All',all:'All',
  sum:'/ {n} paid',colNo:'No.',colName:'Name · IG',colT:'Table',colPay:'Payment',
  unpaid:'Unpaid',paid:'Paid',unset:'Not set',confirmPay:'Confirm',confirmUnpay:'Mark unpaid?',
  group:'Group of {n}',tbd:'TBD',
  emptyQ:'No results',emptyQ2:'Nobody matches “{q}”',emptyTodo:'All collected',emptyTodo2:'No unpaid guests in this view',emptyNone:'No data',
  grpTitle:'{reg} · {n} guests',grpHint:'Check the list. Ticked guests will be marked paid.',thisDue:'Amount due',grpGo:'Confirm {n} paid',grpPick:'Select guests',
  lPay:'{name} marked paid',lUnpay:'{name} marked unpaid',lGrp:'{reg}: {n} guests marked paid',undone:'Undone · {l}',noUndo:'Nothing to undo',
  histTitle:'My actions',histHint:'Undo any single action (only guests changed from this phone).',histEmpty:'No actions yet',histDone:'Undone',histClose:'Close',histChanged:'Changed since, skipped {n}',
  logoutQ:'Log out?',logoutPend:'{n} changes are still uploading. Log out anyway?',
  ovAll:'Overview · {n} guests',kPaid:'Paid',kUnpaid:'Unpaid',kTotal:'Guests',kPaidAmt:'Collected',kDueAmt:'Outstanding',kAllAmt:'Total due',
  zones:'Zones',zs:'{p}% · {u} unpaid · {d} outstanding',pm:'Payment method',pmh:['Method','Guests','Paid','Unpaid','Outstanding'],noPm:'(blank)',ct:'Countries',cth:['Country','Guests','Paid','Unpaid'],
  coll:'Collectors',collh:['Zone · collector','Guests','Collected'],recent:'Recent updates',noRecent:'No on-site changes yet',zoneN:'Zone {z}'}};
const t=(k,o)=>{let s=(T[LANG]||T.zh)[k];if(s==null)s=T.zh[k]||k;if(o&&typeof s==='string')s=s.replace(/\{(\w+)\}/g,(m,x)=>o[x]!=null?o[x]:m);return s};
const zname=id=>ZN[LANG][id]||'';
const tErr=m=>{m=String(m||'');if(LANG!=='en')return m;if(/錯誤太多次/.test(m))return 'Too many wrong attempts. Try again in 10 minutes.';if(/密碼不正確/.test(m))return 'Incorrect passcode'+(/示範/.test(m)?' (demo: zone number ×4, admin 0714)':'');if(/連線失敗/.test(m))return 'Connection failed';if(/沒有這個區域/.test(m))return 'Unknown zone';return m};
const payTxt=p=>p==='已收款'?t('paid'):p==='未收款'?t('unpaid'):p?p:t('unset');
function applyLang(){document.documentElement.lang=LANG==='en'?'en':'zh-Hant';document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  renderZones();renderPinPad();if(S.zone&&!$('#pin').hidden)setPinTitle();if(S.zone&&!$('#app').hidden){render();renderHistB()}if(S.grp)openGroup(S.grp.reg,true);if(S.histOpen)openHist()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;LANG=b.dataset.lang;LS.set('lang',LANG);applyLang()});

let S={hist:[],zone:null,pin:'',who:'',rows:[],v:0,f:LS.get('f','todo'),sort:LS.get('sort','n'),q:'',zf:0,tab:LS.get('tab','stat'),pend:{},conf:null,busy:false,off:false};
const isAdmin=()=>S.zone&&S.zone.id===0;
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
/* ===== 呼叫雲端 ===== */
async function call(body){
  const payload=Object.assign({api:'pay',z:S.zone.id,p:S.pin,who:S.who},body);
  if(DEMO)return demoApi(payload);
  const r=await fetch(API,{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error('連線失敗（'+r.status+'）');const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.error||'失敗'),{server:true});return j}

/* ===== 登入 ===== */
function renderZones(){
  $('#zones').innerHTML=[1,2,3,4,5].map(id=>'<button class="zb c'+id+'" data-z="'+id+'"><span class="zi">'+id+'</span><span class="zn">'+esc(zname(id))+'</span></button>').join('');
  $('#admz').innerHTML='<button class="zb c0" data-z="0"><span class="zi">★</span><span class="zn">'+esc(zname(0))+'</span></button>'}
let pinBuf='';
function renderPin(){$('#dots').innerHTML=[0,1,2,3].map(i=>'<i'+(i<pinBuf.length?' class="f"':'')+'></i>').join('')}
function renderPinPad(){$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','0','del'].map(k=>k==='del'?'<button class="del" data-k="del">'+t('del')+'</button>':'<button data-k="'+k+'"'+(k==='0'?' class="k0"':'')+'>'+k+'</button>').join('')}
function setPinTitle(){const id=S.zone.id;$('#pinIcon').className='zi c'+id;$('#pinIcon').textContent=id===0?'★':id;$('#pinTtl').textContent=zname(id)}
function openPin(id){S.zone={id};pinBuf='';renderPin();setPinTitle();
  $('#err').textContent='';$('#who').value=LS.get('who','');$('#login').hidden=true;$('#pin').hidden=false;scrollTo(0,0)}
$('#login').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(b)openPin(+b.dataset.z)});
$('#pinBack').onclick=()=>{$('#pin').hidden=true;$('#login').hidden=false;S.zone=null};
$('#pad').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||S.logging)return;const k=b.dataset.k;if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;renderPin();if(pinBuf.length===4)tryLogin(pinBuf)});
async function tryLogin(pin){S.pin=pin;S.who=$('#who').value.trim();LS.set('who',S.who);$('#err').textContent=t('loggingIn');S.logging=true;
  try{const j=await call({op:'list'});LS.set('sess',{z:S.zone.id,p:pin,who:S.who});S.logging=false;enter(j)}
  catch(e){S.logging=false;$('#err').textContent=tErr(e.message);pinBuf='';renderPin();const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
function enter(j){S.hist=(LS.get('hist'+S.zone.id,[])||[]).filter(h=>h&&h.prev);$('#login').hidden=true;$('#pin').hidden=true;$('#app').hidden=false;if(j)apply(j);else render();renderHistB();startPoll()}
$('#logout').onclick=()=>{const n=Object.keys(S.pend).length;if(!confirm(n?t('logoutPend',{n}):t('logoutQ')))return;LS.del('sess');S.pend={};LS.del('pend');LS.del('hist'+S.zone.id);location.reload()};

/* ===== 資料 ===== */
function apply(j){S.rows=j.rows||[];S.v=j.v||S.v;if(j.event)$('#evName').textContent=j.event;LS.set('cache'+S.zone.id,{rows:S.rows,v:S.v,at:Date.now()});render()}
const payOf=r=>S.pend[r.no]||r.pay||'';
const paid=r=>payOf(r)==='已收款';
const dueSum=a=>a.reduce((s,r)=>s+(Number(r.due)||0),0);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const byNo=no=>S.rows.find(x=>x.no===no);
function base(){return isAdmin()&&S.zf?S.rows.filter(r=>r.z===S.zf):S.rows}
function visible(){const q=S.q.trim().toLowerCase();let a=base().slice();
  if(q){const qn=q.replace(/^#/,'');a=a.filter(r=>(/^\d+$/.test(qn)&&(String(r.n)===qn||String(r.t)===qn))||[r.name,r.ig,r.reg].join(' ').toLowerCase().includes(q))}
  if(S.f==='todo')a=a.filter(r=>!paid(r));else if(S.f==='done')a=a.filter(r=>paid(r));
  if(S.sort==='table')a.sort((x,y)=>((x.t==null?999:x.t)-(y.t==null?999:y.t))||x.z-y.z||x.n-y.n);else a.sort((x,y)=>x.z-y.z||x.n-y.n);
  return a}
function igHtml(ig,cls){if(!ig)return '';const u=igUrl(ig);return u?'<a class="'+cls+'" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(ig)+'</a>':'<div class="'+cls+'">'+esc(ig)+'</div>'}
function render(){if(!S.zone)return;const adm=isAdmin();
  $('#zTitle').textContent=zname(S.zone.id);
  $('#tabs').hidden=!adm;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const showList=!adm||S.tab==='list';$('#bar').hidden=!showList;
  const B=base(),done=B.filter(paid).length;
  $('#sum').innerHTML=showList?'<div class="t"><b>'+done+'</b><span>'+esc(t('sum',{n:B.length}))+'</span><em>'+pct(done,B.length)+'%</em></div><div class="prog"><i style="width:'+pct(done,B.length)+'%"></i></div>':'';
  if(!showList){renderStats();renderSync();return}
  $('#seg').innerHTML=[['todo',t('fTodo'),B.length-done],['done',t('fDone'),done],['all',t('fAll'),B.length]].map(([k,l,n])=>'<button data-f="'+k+'" class="'+(S.f===k?'on':'')+'">'+esc(l)+'<small>'+n+'</small></button>').join('');
  $('#zf').hidden=!adm;if(adm)$('#zf').innerHTML='<button data-zf="0" class="'+(S.zf===0?'on':'')+'">'+esc(t('all'))+'</button>'+[1,2,3,4,5].map(id=>'<button data-zf="'+id+'" class="c'+id+(S.zf===id?' on':'')+'"><i></i>'+esc(ZS[LANG][id])+'</button>').join('');
  $('#sortb').textContent=S.sort==='table'?t('sortT'):t('sortN');
  const a=visible(),regUn={},regAll={};S.rows.forEach(r=>{if(!r.reg)return;regAll[r.reg]=(regAll[r.reg]||0)+1;if(!paid(r))regUn[r.reg]=(regUn[r.reg]||0)+1});
  const cf=S.conf;
  $('#list').innerHTML=a.length?'<div class="lh"><span class="c-no">'+esc(t('colNo'))+'</span><span class="c-nm">'+esc(t('colName'))+'</span><span class="c-t">'+esc(t('colT'))+'</span><span class="c-p">'+esc(t('colPay'))+'</span></div><div class="lst">'+a.map(r=>{const p=payOf(r),c=cf&&cf.no===r.no;
      const cls=c?(cf.to==='已收款'?'cfp':'cfu'):p==='已收款'?'ok':p==='未收款'?'':'none',lbl=c?(cf.to==='已收款'?t('confirmPay'):t('confirmUnpay')):payTxt(p);
      const g=r.reg&&regAll[r.reg]>1&&regUn[r.reg]?'<button class="grp" data-all="'+esc(r.reg)+'">'+esc(t('group',{n:regAll[r.reg]}))+'</button>':'';
      const tb=r.t!=null?'<span class="tb"><b>'+r.t+'</b></span>':'<span class="tb na"><b>'+esc(t('tbd'))+'</b></span>';
      return '<div class="row c'+r.z+(c?' arm':'')+'"><span class="no">'+r.n+(adm?'<i class="zd"></i>':'')+'</span><div class="nm"><div class="n1"><span class="f">'+flag(r.c)+'</span>'+esc(r.name)+(S.pend[r.no]?'<span class="pend"></span>':'')+'</div>'+igHtml(r.ig,'ig')+g+'</div>'+tb+'<button class="pb '+cls+'" data-no="'+esc(r.no)+'">'+esc(lbl)+'</button></div>'}).join('')+'</div>'
    :'<div class="empty">'+(S.q?'<b>'+esc(t('emptyQ'))+'</b>'+esc(t('emptyQ2',{q:S.q})):S.f==='todo'?'<b>'+esc(t('emptyTodo'))+'</b>'+esc(t('emptyTodo2')):'<b>'+esc(t('emptyNone'))+'</b>')+'</div>';
  renderSync()}

/* ===== 管理者統計 ===== */
function renderStats(){const R=S.rows,P=R.filter(paid),U=R.filter(r=>!paid(r)),f=n=>Number(n).toLocaleString('en-US');
  const k1='<div class="h3" style="margin-top:20px">'+esc(t('ovAll',{n:R.length}))+'</div><div class="bento"><div class="tile wide"><b>'+pct(P.length,R.length)+'%</b><div class="prog"><i style="width:'+pct(P.length,R.length)+'%"></i></div></div>'+
    '<div class="tile g"><small>'+t('kPaid')+'</small><b>'+P.length+'</b></div><div class="tile r"><small>'+t('kUnpaid')+'</small><b>'+U.length+'</b></div><div class="tile"><small>'+t('kTotal')+'</small><b>'+R.length+'</b></div>'+
    '<div class="tile m g"><small>'+t('kPaidAmt')+'</small><b>'+f(dueSum(P))+'</b></div><div class="tile m r"><small>'+t('kDueAmt')+'</small><b>'+f(dueSum(U))+'</b></div><div class="tile m"><small>'+t('kAllAmt')+'</small><b>'+f(dueSum(R))+'</b></div></div>';
  const zt='<div class="h3">'+t('zones')+'</div><div class="card">'+[1,2,3,4,5].map(id=>{const a=R.filter(r=>r.z===id),p=a.filter(paid);return '<div class="zrow c'+id+'"><div class="a"><span class="zi">'+id+'</span><span class="zn">'+esc(zname(id))+'</span><b>'+p.length+' / '+a.length+'</b></div><div class="prog"><i style="width:'+pct(p.length,a.length)+'%"></i></div><div class="s">'+esc(t('zs',{p:pct(p.length,a.length),u:a.length-p.length,d:f(dueSum(a.filter(r=>!paid(r))))}))+'</div></div>'}).join('')+'</div>';
  const th=h=>'<tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>';
  const byM={};R.forEach(r=>{const k=r.paym||t('noPm');(byM[k]=byM[k]||{a:0,p:0,da:0,dp:0}).a++;byM[k].da+=Number(r.due)||0;if(paid(r)){byM[k].p++;byM[k].dp+=Number(r.due)||0}});
  const mt='<div class="h3">'+t('pm')+'</div><div class="card tblw"><table>'+th(t('pmh'))+Object.entries(byM).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.a+'</td><td class="g">'+v.p+'</td><td class="r">'+(v.a-v.p)+'</td><td>'+f(v.da-v.dp)+'</td></tr>').join('')+'</table></div>';
  const byC={};R.forEach(r=>{const k=r.c||'?';(byC[k]=byC[k]||{a:0,p:0}).a++;if(paid(r))byC[k].p++});
  const ct='<div class="h3">'+t('ct')+'</div><div class="card tblw"><table>'+th(t('cth'))+Object.entries(byC).sort((x,y)=>y[1].a-x[1].a).map(([k,v])=>'<tr><td>'+flag(k)+' '+esc(cname(k))+'</td><td>'+v.a+'</td><td class="g">'+v.p+'</td><td class="r">'+(v.a-v.p)+'</td></tr>').join('')+'</table></div>';
  const who={};R.filter(r=>r.by&&r.ts).forEach(r=>{const k=r.by.replace(/^收款（|）$/g,'');(who[k]=who[k]||{n:0,d:0}).n++;if(paid(r))who[k].d+=Number(r.due)||0});
  const wt=Object.keys(who).length?'<div class="h3">'+t('coll')+'</div><div class="card tblw"><table>'+th(t('collh'))+Object.entries(who).sort((x,y)=>y[1].n-x[1].n).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.n+'</td><td>'+f(v.d)+'</td></tr>').join('')+'</table></div>':'';
  const recent=R.filter(r=>r.ts).sort((x,y)=>y.ts-x.ts).slice(0,25);
  const ft='<div class="h3">'+t('recent')+'</div><div class="card">'+(recent.length?'<ul class="feed">'+recent.map(r=>'<li><time>'+esc(r.at)+'</time><span>'+esc(r.name)+' <b class="'+(paid(r)?'g':'r')+'">'+esc(payTxt(payOf(r)))+'</b><small>'+esc(t('zoneN',{z:r.z}))+' #'+r.n+(r.by?' · '+esc(r.by.replace(/^收款（|）$/g,'')):'')+'</small></span></li>').join('')+'</ul>':'<div class="muted">'+t('noRecent')+'</div>')+'</div>';
  $('#list').innerHTML=k1+zt+mt+ct+wt+ft}
function renderSync(){const n=Object.keys(S.pend).length,e=$('#sync');e.className='sync'+(S.off?' off':n||S.busy?' busy':'');e.querySelector('span').textContent=S.off?(n?t('offlineN',{n}):t('offline')):n?t('uploading',{n}):t('synced')}

/* ===== 點選：每一個改動都要按兩下（先變成「確認」再送出） ===== */
const ARM_MS=4000,MIN_GAP=350;
function arm(no,to){S.conf={no,to,at:Date.now()};render();clearTimeout(S.confT);S.confT=setTimeout(()=>{if(S.conf&&S.conf.no===no){S.conf=null;render()}},ARM_MS)}
function disarm(){if(S.conf){S.conf=null;clearTimeout(S.confT);render()}}
function setPay(nos,pay,lab,noHist){const prev={};nos.forEach(no=>{const r=byNo(no);if(r)prev[no]=payOf(r)==='已收款'?'已收款':'未收款'});
  const ch=nos.filter(no=>prev[no]&&prev[no]!==pay);if(!ch.length)return;
  if(!noHist){S.hist.push(Object.assign({to:pay,at:Date.now(),prev:Object.fromEntries(ch.map(n=>[n,prev[n]]))},lab));if(S.hist.length>60)S.hist.shift();LS.set('hist'+S.zone.id,S.hist);showUndo();renderHistB()}
  ch.forEach(no=>{S.pend[no]=pay});LS.set('pend',{z:S.zone.id,p:S.pend});S.conf=null;render();try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}flushSoon()}
function hLabel(h){if(!h)return '';if(h.k==='grp')return t('lGrp',{reg:h.reg,n:Object.keys(h.prev).length});if(h.k==='one')return t(h.to==='已收款'?'lPay':'lUnpay',{name:h.name});return h.label||''}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.pb');
  if(b){const no=b.dataset.no,r=byNo(no);if(!r)return;const to=paid(r)?'未收款':'已收款';
    if(S.conf&&S.conf.no===no&&S.conf.to===to){if(Date.now()-S.conf.at<MIN_GAP)return; // 太快的連點不算確認
      setPay([no],to,{k:'one',name:r.name})}else arm(no,to);return}
  const a=e.target.closest('[data-all]');if(a){disarm();openGroup(a.dataset.all);return}
  if(!e.target.closest('a'))disarm()});
/* 整筆：先列出整筆名單，核對後才送出 */
function openGroup(reg,keep){const mem=S.rows.filter(r=>r.reg===reg).sort((x,y)=>(x.role==='本人'?0:1)-(y.role==='本人'?0:1)||x.n-y.n);
  if(!keep)S.grp={reg,sel:new Set(mem.filter(r=>!paid(r)).map(r=>r.no))};
  $('#shT').textContent=t('grpTitle',{reg,n:mem.length});$('#shP').textContent=t('grpHint');$('#shF').hidden=false;$('#shGo').hidden=false;$('#shX').textContent=t('cancel');
  $('#shL').innerHTML=mem.map(r=>{const ok=paid(r);return '<button class="it'+(ok?' dis':' on')+'" data-no="'+esc(r.no)+'"><span class="ck"></span><span class="ino">'+r.n+'</span><div class="nm"><div class="n1"><span class="f">'+flag(r.c)+'</span>'+esc(r.name)+'</div>'+(r.ig?'<div class="ig">'+esc(r.ig)+'</div>':'')+'</div>'+(ok?'<span class="paid">'+esc(t('paid'))+'</span>':Number(r.due)?'<span class="amt">'+money(r.due)+'</span>':'')+(r.t!=null?'<span class="tb"><b>'+r.t+'</b></span>':'<span class="tb na"><b>'+esc(t('tbd'))+'</b></span>')+'</button>'}).join('');
  updGroup();$('#mask').hidden=false;document.body.style.overflow='hidden'}
function updGroup(){const n=S.grp.sel.size,amt=dueSum(S.rows.filter(r=>S.grp.sel.has(r.no))),g=$('#shGo');
  document.querySelectorAll('#shL .it:not(.dis)').forEach(i=>i.classList.toggle('on',S.grp.sel.has(i.dataset.no)));
  $('#shTot').innerHTML=amt?'<span>'+esc(t('thisDue'))+'</span><b>'+money(amt)+'</b>':'';$('#shTot').hidden=false;
  g.disabled=!n;g.textContent=n?t('grpGo',{n}):t('grpPick')}
function closeSheet(){$('#mask').hidden=true;document.body.style.overflow='';S.grp=null;S.histOpen=false}
$('#shL').addEventListener('click',e=>{const u=e.target.closest('[data-undo]');if(u){undoAt(+u.dataset.undo);return}
  if(!S.grp)return;const i=e.target.closest('.it');if(!i||i.classList.contains('dis'))return;const no=i.dataset.no;S.grp.sel.has(no)?S.grp.sel.delete(no):S.grp.sel.add(no);updGroup()});
$('#shX').onclick=closeSheet;
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeSheet()});
$('#shGo').onclick=()=>{if(!S.grp)return;const nos=[...S.grp.sel],reg=S.grp.reg;if(!nos.length)return;closeSheet();setPay(nos,'已收款',{k:'grp',reg})};
/* 復原：底部提示＝復原最新一筆；「紀錄」可以挑任何一筆單獨復原 */
function showUndo(){const h=S.hist[S.hist.length-1];$('#undoT').textContent=hLabel(h);const u=$('#undo');u.hidden=true;void u.offsetWidth;u.hidden=false;clearTimeout(showUndo.t);showUndo.t=setTimeout(()=>u.hidden=true,7000)}
function renderHistB(){const n=S.hist.length,b=$('#histB');b.hidden=!n;b.textContent=t('histN',{n})}
function undoAt(i){const h=S.hist[i];if(!h)return;S.hist.splice(i,1);LS.set('hist'+S.zone.id,S.hist);$('#undo').hidden=true;
  // 只復原「現在狀態仍是這筆操作改成的樣子」的人，避免蓋掉之後別的改動
  const back={};let skip=0;Object.entries(h.prev).forEach(([no,p])=>{const r=byNo(no);if(!r)return;if(payOf(r)!==h.to){skip++;return}(back[p]=back[p]||[]).push(no)});
  Object.entries(back).forEach(([p,nos])=>setPay(nos,p,null,true));renderHistB();toast(t('undone',{l:hLabel(h)})+(skip?' · '+t('histChanged',{n:skip}):''));if(S.histOpen)openHist()}
function openHist(){S.histOpen=true;S.grp=null;$('#shT').textContent=t('histTitle');$('#shP').textContent=t('histHint');$('#shTot').hidden=true;$('#shGo').hidden=true;$('#shX').textContent=t('histClose');
  const H=S.hist.map((h,i)=>[h,i]).reverse();const tm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  $('#shL').innerHTML=H.length?H.map(([h,i])=>'<div class="hi"><time>'+(h.at?tm(h.at):'')+'</time><span class="hl">'+esc(hLabel(h))+'</span><button class="hu" data-undo="'+i+'">'+esc(t('undo'))+'</button></div>').join(''):'<div class="muted" style="padding:18px 0">'+esc(t('histEmpty'))+'</div>';
  $('#mask').hidden=false;document.body.style.overflow='hidden'}
$('#undoGo').onclick=()=>undoAt(S.hist.length-1);
$('#histB').onclick=()=>{disarm();openHist()};
$('#seg').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;S.f=b.dataset.f;S.conf=null;LS.set('f',S.f);render();scrollTo(0,0)};
$('#zf').onclick=e=>{const b=e.target.closest('[data-zf]');if(!b)return;S.zf=+b.dataset.zf;render();scrollTo(0,0)};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;LS.set('tab',S.tab);render();scrollTo(0,0)};
$('#sortb').onclick=()=>{S.sort=S.sort==='table'?'n':'table';LS.set('sort',S.sort);render()};
$('#q').addEventListener('input',e=>{S.q=e.target.value;$('#qx').hidden=!S.q;S.conf=null;render()});
$('#qx').onclick=()=>{S.q='';$('#q').value='';$('#qx').hidden=true;render();$('#q').focus()};
addEventListener('scroll',()=>{const b=$('#bar');if(b)b.classList.toggle('sh',b.getBoundingClientRect().top<=0&&scrollY>0)},{passive:true});
// 防止縮放：雙擊交給 CSS touch-action，雙指縮放在 iOS 另外擋
document.addEventListener('gesturestart',e=>e.preventDefault());
/* ===== 上傳與同步 ===== */
let flushT=null,backoff=1000;
function flushSoon(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms==null?300:ms)}
async function flush(){const ops=Object.entries(S.pend).map(([no,pay])=>({no,pay}));if(!ops.length||S.busy)return;S.busy=true;renderSync();
  try{const j=await call({op:'set',ops});S.busy=false;S.off=false;backoff=1000;
    // 只有雲端回傳的資料「真的」等於手機上想要的狀態才算完成；期間若按了復原／又改了，會留著再送一次
    const by={};(j.rows||[]).forEach(r=>by[r.no]=r);
    if(j.part){ // 新版雲端只回傳這次送出的人：逐筆核對
      S.rows.forEach(r=>{const x=by[r.no];if(x){r.pay=x.pay;r.at=x.at;r.ts=x.ts;r.by=x.by}});
      ops.forEach(o=>{if(S.pend[o.no]!==o.pay)return;const x=by[o.no];if(!x||x.pay===o.pay)delete S.pend[o.no]});
      LS.set('pend',{z:S.zone.id,p:S.pend});LS.set('cache'+S.zone.id,{rows:S.rows,v:S.v,at:Date.now()});render();
    }else{
      Object.keys(S.pend).forEach(no=>{const r=by[no];if(!r){delete S.pend[no];return}if((r.pay||'')===S.pend[no])delete S.pend[no]});
      LS.set('pend',{z:S.zone.id,p:S.pend});apply(j)}
    S.wseq=(S.wseq||0)+1;if(Object.keys(S.pend).length)flushSoon(0)}
  catch(e){S.busy=false;if(e.server&&!/其他人正在儲存/.test(e.message)){toast(tErr(e.message));if(/密碼/.test(e.message)){LS.del('sess');setTimeout(()=>location.reload(),1500)}}S.off=!e.server;if(/其他人正在儲存/.test(e.message))S.off=false;renderSync();backoff=Math.min(backoff*2,20000);flushSoon(backoff)}}
let pollT=null;
function startPoll(){clearInterval(pollT);pollT=setInterval(poll,POLL);setTimeout(poll,300)}
async function poll(){if(S.busy||document.hidden)return;if(Object.keys(S.pend).length){flush();return}
  try{const j=await call({op:'ver'});S.off=false;if(j.v!==S.v){const seq=S.wseq||0;const k=await call({op:'list'});if(!Object.keys(S.pend).length&&!S.busy&&(S.wseq||0)===seq)apply(k)}else renderSync()}catch(e){if(!e.server){S.off=true;renderSync()}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.zone&&!$('#app').hidden)poll()});
addEventListener('online',()=>{S.off=false;flushSoon(0)});
addEventListener('beforeunload',e=>{if(Object.keys(S.pend).length){e.preventDefault();e.returnValue=''}});
/* ===== 示範資料 ===== */
let DB=null,DBV=1;
function demoApi(b){if(!DB){const names=['Alice Chen','Ben Wu','Cindy Lin','David Ho','Emma Sato','Frank Lee','Grace Kim','Henry Park','Ivy Tan','Jack Ng','王小明','林美玲','陳志豪','黃怡君','張家豪','李佳穎','吳俊傑','劉雅婷','蔡宗翰','楊淑芬'];DB=[];let n=1;const cs=['TW','JP','US','HK','KR'];
    for(let z=1;z<=5;z++)for(let i=0;i<8;i++){const sz=1+(i%3);const reg='TP'+String(z*100+i).padStart(3,'0');const pd=i%3===0;for(let j=0;j<sz;j++){DB.push({z,no:'D'+(n++),name:i===2&&j===0?'Christopher Alexander Montgomery-Wellington':names[(i*3+j+z)%names.length],ig:i===1?'@a_very_long_instagram_handle_'+z+j+'_official':'@demo_'+z+i+j,c:cs[z-1],reg,role:j?'攜伴':'本人',party:String(sz),t:z*5+i,pay:pd?'已收款':'未收款',due:j?'':String(1200*sz),paym:pd?'線上付款':'現場付款',id:String(n),at:'',ts:0,by:''})}}
    for(let z=1;z<=5;z++){const a=DB.filter(r=>r.z===z).sort((x,y)=>{const k=s=>[/^[a-z0-9]/i.test(s)?0:1,s.toLowerCase()];const p=k(x.name),q=k(y.name);return p[0]-q[0]||(p[1]<q[1]?-1:p[1]>q[1]?1:0)});a.forEach((r,i)=>r.n=i+1)}}
  return new Promise((ok,no)=>setTimeout(()=>{const want=b.z===0?'0714':String(b.z).repeat(4);if(String(b.p)!==want)return no(Object.assign(new Error('密碼不正確（示範：區號重複 4 次，管理者 0714）'),{server:true}));
    if(b.op==='set')b.ops.forEach(o=>{const r=DB.find(x=>x.no===o.no);if(r&&(b.z===0||r.z===b.z)){r.pay=o.pay;const d=new Date();r.at=String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+d.toTimeString().slice(0,5);r.ts=d.getTime();r.by='收款（'+ZN.zh[b.z]+(b.who?'・'+b.who:'')+'）'}});
    if(b.op==='set')return ok({ok:true,part:true,v:++DBV,rows:b.ops.map(o=>DB.find(x=>x.no===o.no)).filter(r=>r&&(b.z===0||r.z===b.z)).map(r=>({no:r.no,pay:r.pay,at:r.at,ts:r.ts,by:r.by}))});
    ok({ok:true,v:DBV,event:'示範晚宴',rows:JSON.parse(JSON.stringify(b.z===0?DB:DB.filter(r=>r.z===b.z)))})},b.op==='set'?900:200))}
/* ===== 啟動：記得上次登入就直接進去（先顯示手機上暫存的資料，再背景更新） ===== */
(function boot(){if(DEMO)$('#demoBar').hidden=false;applyLang();
  const s=LS.get('sess',null);if(!s)return;if(!(s.z>=0&&s.z<=5))return;S.zone={id:s.z};S.pin=s.p;S.who=s.who||'';
  const pd=LS.get('pend',null);if(pd&&pd.z===S.zone.id)S.pend=pd.p||{};
  const c=LS.get('cache'+S.zone.id,null);if(c){S.rows=c.rows;S.v=c.v}
  enter(null);call({op:'list'}).then(j=>{if(!Object.keys(S.pend).length)apply(j);else{S.rows=j.rows;render();flushSoon(0)}}).catch(e=>{if(e.server){toast(tErr(e.message));LS.del('sess');setTimeout(()=>location.reload(),1500)}else{S.off=true;renderSync()}})})();
</script>
