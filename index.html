<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="robots" content="noindex,nofollow">
<title>現場收款</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--ink2:#3a3a3c;--muted:#8e8e93;--hair:rgba(60,60,67,.14);--accent:#007aff;--ok:#34c759;--okd:#248a3d;--bad:#ff3b30;--badd:#d70015;--warn:#ff9500;--fill:rgba(120,120,128,.12);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--ink2:#ebebf5;--muted:#8e8e93;--hair:rgba(84,84,88,.6);--accent:#0a84ff;--ok:#30d158;--okd:#30d158;--bad:#ff453a;--badd:#ff6961;--fill:rgba(120,120,128,.24)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
.num{font-variant-numeric:tabular-nums}
/* 登入 */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + var(--safe-t)) 16px 24px}
.lg-h{text-align:center;margin-bottom:22px}.lg-h small{color:var(--muted);font-size:14px}.lg-h h1{margin:4px 0 0;font-size:30px;letter-spacing:.5px}
.zones{display:grid;gap:10px;max-width:440px;margin:0 auto;width:100%}
.zb{background:var(--card);border-radius:16px;padding:15px 18px;text-align:left;display:flex;align-items:center;gap:14px;box-shadow:0 1px 0 var(--hair)}
.zb b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:18px;flex:none}
.zb span{font-size:17px;font-weight:600}.zb.on{outline:3px solid var(--accent)}
.zb.adm{margin-top:6px}.zb.adm b{background:#1c1c1e}@media (prefers-color-scheme:dark){.zb.adm b{background:#636366}}
.pin{max-width:440px;margin:18px auto 0;width:100%;background:var(--card);border-radius:18px;padding:16px}
.pin .ttl{text-align:center;font-weight:600}.dots{display:flex;justify-content:center;gap:14px;margin:14px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.dots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:14px;background:var(--fill);font-size:24px;font-weight:600}
.pad button:active{background:var(--hair)}
.who{display:block;width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--bg);color:var(--ink);font:inherit}
.err{color:var(--bad);text-align:center;min-height:22px;margin-top:8px;font-size:14px}
/* 主畫面 */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);padding:calc(8px + var(--safe-t)) 0 8px;border-bottom:1px solid var(--hair)}
.hr{display:flex;align-items:center;gap:10px}.hr h2{margin:0;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:var(--warn);animation:pl 1s infinite}.sync.off i{background:var(--bad)}@keyframes pl{50%{opacity:.3}}
.out{font-size:14px;color:var(--accent);padding:6px 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.st{background:var(--card);border-radius:12px;padding:7px 9px;min-width:0}.st small{display:block;font-size:11.5px;color:var(--muted)}.st b{font-size:17px;font-variant-numeric:tabular-nums}
.st.ok b{color:var(--okd)}.st.bad b{color:var(--badd)}
.tools{display:flex;gap:8px;margin-top:8px;align-items:center}
.q{flex:1;position:relative}.q input{width:100%;padding:10px 34px 10px 12px;border-radius:12px;border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:16px}
.q button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:14px;color:var(--muted);font-size:18px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-top:8px;overflow-x:auto}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
.sortb{font-size:13px;color:var(--accent);white-space:nowrap;padding:8px 4px}
main{padding:10px 0 calc(40px + var(--safe-b))}
.lst{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--hair);min-height:62px}
.row:last-child{border-bottom:0}
.no{flex:none;width:40px;text-align:right;font-size:17px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.zt{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:0 5px;margin-right:4px;vertical-align:1px}
.fl{font-size:24px;line-height:1;width:28px;text-align:center;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small em{font-style:normal;color:var(--ink2)}
.grp{font-size:12.5px;color:var(--accent);font-weight:600;margin-left:6px}
.pb{flex:none;min-width:96px;height:42px;border-radius:12px;font-weight:700;font-size:15px;border:2px solid var(--bad);color:var(--badd);background:transparent;transition:transform .08s}
.pb:active{transform:scale(.96)}
.pb.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pb.conf{background:var(--warn);border-color:var(--warn);color:#fff;font-size:13px}
.pb.none{border-color:var(--muted);color:var(--muted)}
.pend{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.demo{background:var(--warn);color:#fff;text-align:center;font-size:12.5px;padding:4px}
/* 統計 */
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big div{background:var(--fill);border-radius:12px;padding:9px 10px}.big small{display:block;color:var(--muted);font-size:12px}.big b{font-size:20px;font-variant-numeric:tabular-nums}
.big .ok b{color:var(--okd)}.big .bad b{color:var(--badd)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600}tr.tot td{font-weight:800;border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:4px;min-width:60px}.bar i{display:block;height:100%;background:var(--ok)}
.tblw{overflow-x:auto}
.feed{list-style:none;margin:0;padding:0;font-size:14px}.feed li{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--hair)}.feed li:last-child{border-bottom:0}
.feed time{color:var(--muted);flex:none;width:86px;font-variant-numeric:tabular-nums}.feed span{flex:1;min-width:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>示範模式：資料是假的，不會寫入雲端</div>
<section id="login">
  <div class="lg-h"><small id="evName">晚宴</small><h1>現場收款</h1></div>
  <div class="zones" id="zones"></div>
  <div class="pin" id="pinBox" hidden>
    <div class="ttl" id="pinTtl">請輸入密碼</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad"></div>
    <input class="who" id="who" placeholder="你的名字（選填，會記在紀錄裡）" maxlength="20" autocomplete="off">
    <div class="err" id="err"></div>
  </div>
</section>
<section id="app" hidden>
  <header><div class="wrap">
    <div class="hr"><h2 id="zTitle"></h2><span class="sync" id="sync"><i></i><span>已同步</span></span><button class="out" id="logout">登出</button></div>
    <div class="seg" id="tabs" hidden><button data-tab="stat">統計</button><button data-tab="list">名單</button></div>
    <div id="listTools">
      <div class="stats" id="stats"></div>
      <div class="seg" id="zf" hidden></div>
      <div class="tools"><div class="q"><input id="q" type="search" placeholder="搜尋編號、姓名、IG、桌號" autocomplete="off" enterkeyhint="search"><button id="qx" hidden aria-label="清除">×</button></div><button class="sortb" id="sortb"></button></div>
      <div class="seg" id="seg"><button data-f="todo">未收款</button><button data-f="done">已收款</button><button data-f="all">全部</button></div>
    </div>
  </div></header>
  <main class="wrap" id="list"></main>
</section>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
/* ===== 設定：Apps Script 部署網址（結尾是 /exec） ===== */
const API='https://script.google.com/macros/s/AKfycby0rorBPBH4beK8wfPxJ-v-fUYVUQA-2RYGyCe0YXC3CG85Fn5ouzq4zLqdL49iXbcJ/exec';
const ZONES=[{id:1,name:'台灣區'},{id:2,name:'日本區'},{id:3,name:'美洲與大洋洲區'},{id:4,name:'港星馬中（華語圈）'},{id:5,name:'韓國、歐洲與東南亞區'}];
const ADMIN={id:0,name:'管理者（全部區域）'};
const SHORT={1:'台灣',2:'日本',3:'美洲大洋洲',4:'港星馬中',5:'韓歐東南亞'};
const CN={TW:'台灣',JP:'日本',KR:'韓國',HK:'香港',CN:'中國',US:'美國',AU:'澳洲',SG:'新加坡',MY:'馬來西亞',TH:'泰國',PH:'菲律賓',ID:'印尼',VN:'越南',MO:'澳門',GB:'英國',UK:'英國',CA:'加拿大',FR:'法國',DE:'德國',ES:'西班牙',NL:'荷蘭',BR:'巴西',MN:'蒙古',NZ:'紐西蘭',CL:'智利',MX:'墨西哥',IN:'印度',IT:'義大利'};
const DEMO=/[?&]demo/.test(location.search);
const POLL=8000; // 每 8 秒檢查別人有沒有改資料
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('pay.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pay.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('pay.'+k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag=c=>{c=String(c||'').toUpperCase();if(c==='UK')c='GB';return /^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'🏳️'};
const money=n=>'NT$'+Number(n||0).toLocaleString('en-US');
const zname=id=>(ZONES.find(z=>z.id===id)||{}).name||'';
let S={zone:null,pin:'',who:'',rows:[],v:0,f:LS.get('f','todo'),sort:LS.get('sort','n'),q:'',zf:0,tab:LS.get('tab','stat'),pend:{},conf:null,busy:false,off:false};
const isAdmin=()=>S.zone&&S.zone.id===0;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
/* ===== 呼叫雲端 ===== */
async function call(body){
  const payload=Object.assign({api:'pay',z:S.zone.id,p:S.pin,who:S.who},body);
  if(DEMO)return demoApi(payload);
  const r=await fetch(API,{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error('連線失敗（'+r.status+'）');const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.error||'失敗'),{server:true});return j}
/* ===== 登入 ===== */
function renderZones(){$('#zones').innerHTML=ZONES.map(z=>'<button class="zb'+(S.zone&&S.zone.id===z.id?' on':'')+'" data-z="'+z.id+'"><b>'+z.id+'</b><span>'+esc(z.name)+'</span></button>').join('')+
  '<button class="zb adm'+(S.zone&&S.zone.id===0?' on':'')+'" data-z="0"><b>★</b><span>管理者（全部區域與統計）</span></button>'}
let pinBuf='';
function renderPin(){$('#dots').innerHTML=[0,1,2,3].map(i=>'<i'+(i<pinBuf.length?' class="f"':'')+'></i>').join('')}
$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?'<button data-k="'+k+'">'+k+'</button>':'<span></span>').join('');
$('#zones').onclick=e=>{const b=e.target.closest('[data-z]');if(!b)return;const id=+b.dataset.z;S.zone=id===0?ADMIN:ZONES.find(z=>z.id===id);pinBuf='';renderZones();renderPin();$('#pinBox').hidden=false;$('#pinTtl').textContent=S.zone.name+'：請輸入密碼';$('#err').textContent='';$('#who').value=LS.get('who','');$('#pinBox').scrollIntoView({behavior:'smooth',block:'nearest'})};
$('#pad').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;renderPin();if(pinBuf.length===4)tryLogin(pinBuf)};
async function tryLogin(pin){S.pin=pin;S.who=$('#who').value.trim();LS.set('who',S.who);$('#err').textContent='登入中…';
  try{const j=await call({op:'list'});LS.set('sess',{z:S.zone.id,p:pin,who:S.who});enter(j)}catch(e){$('#err').textContent=e.message;pinBuf='';renderPin()}}
function enter(j){$('#login').hidden=true;$('#app').hidden=false;if(j)apply(j);else render();startPoll()}
$('#logout').onclick=()=>{if(Object.keys(S.pend).length&&!confirm('還有 '+Object.keys(S.pend).length+' 筆沒上傳，確定登出？'))return;LS.del('sess');S.pend={};LS.del('pend');location.reload()};
/* ===== 資料 ===== */
function apply(j){S.rows=j.rows||[];S.v=j.v||S.v;if(j.event)$('#evName').textContent=j.event;LS.set('cache'+S.zone.id,{rows:S.rows,v:S.v,at:Date.now()});render()}
const payOf=r=>S.pend[r.no]||r.pay||'';
const paid=r=>payOf(r)==='已收款';
const dueSum=a=>a.reduce((s,r)=>s+(Number(r.due)||0),0);
function visible(){const q=S.q.trim().toLowerCase();let a=S.rows.slice();
  if(isAdmin()&&S.zf)a=a.filter(r=>r.z===S.zf);
  if(q){const qn=q.replace(/^#/,'');a=a.filter(r=>(/^\d+$/.test(qn)&&String(r.n)===qn)||[r.name,r.ig,r.reg,r.t!=null?r.t+'桌':'',CN[r.c]||r.c].join(' ').toLowerCase().includes(q))}
  if(S.f==='todo')a=a.filter(r=>!paid(r));else if(S.f==='done')a=a.filter(r=>paid(r));
  if(S.sort==='table')a.sort((x,y)=>((x.t==null?999:x.t)-(y.t==null?999:y.t))||x.z-y.z||x.n-y.n);else a.sort((x,y)=>x.z-y.z||x.n-y.n);
  return a}
function render(){if(!S.zone)return;$('#zTitle').textContent=S.zone.name;const adm=isAdmin();
  $('#tabs').hidden=!adm;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const showList=!adm||S.tab==='list';$('#listTools').hidden=!showList;
  if(!showList){renderStats();renderSync();return}
  const base=adm&&S.zf?S.rows.filter(r=>r.z===S.zf):S.rows,done=base.filter(paid),todo=base.filter(r=>!paid(r));
  $('#stats').innerHTML='<div class="st"><small>人數</small><b>'+base.length+'</b></div><div class="st ok"><small>已收款</small><b>'+done.length+'</b></div><div class="st bad"><small>未收款</small><b>'+todo.length+'</b></div><div class="st"><small>待收金額</small><b>'+dueSum(todo).toLocaleString('en-US')+'</b></div>';
  $('#zf').hidden=!adm;if(adm)$('#zf').innerHTML='<button data-zf="0" class="'+(S.zf===0?'on':'')+'">全部</button>'+ZONES.map(z=>'<button data-zf="'+z.id+'" class="'+(S.zf===z.id?'on':'')+'">'+z.id+' '+esc(SHORT[z.id])+'</button>').join('');
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.f));
  $('#sortb').textContent=(S.sort==='table'?'依桌號':'依編號')+' ▾';
  const a=visible();const regUn={};S.rows.forEach(r=>{if(r.reg&&!paid(r))regUn[r.reg]=(regUn[r.reg]||0)+1});
  $('#list').innerHTML=a.length?'<div class="lst">'+a.map(r=>{const p=payOf(r),c=S.conf===r.no;const cls=c?'conf':p==='已收款'?'ok':p==='未收款'?'':'none';const lbl=c?'改回未收款？':p==='已收款'?'✓ 已收款':p||'未設定';
      const g=(r.reg&&regUn[r.reg]>1&&p!=='已收款')?'<button class="grp" data-all="'+esc(r.reg)+'">整筆 '+regUn[r.reg]+' 人</button>':'';
      return '<div class="row"><span class="no">'+(adm?'<span class="zt">'+r.z+'</span>':'')+r.n+'</span><span class="fl">'+flag(r.c)+'</span><div class="nm"><b>'+esc(r.name)+(S.pend[r.no]?'<span class="pend" title="還沒上傳"></span>':'')+'</b><small>'+(r.ig?'<em>'+esc(r.ig)+'</em> · ':'')+esc(CN[r.c]||r.c)+' · '+esc(r.reg)+' '+esc(r.role||'')+(r.t!=null?' · '+r.t+' 桌':' · 待排')+(Number(r.due)?' · 應付 '+money(r.due):'')+(p==='已收款'&&r.at?' · '+esc(r.at):'')+'</small></div>'+g+'<button class="pb '+cls+'" data-no="'+esc(r.no)+'">'+lbl+'</button></div>'}).join('')+'</div>'
    :'<div class="empty">'+(S.q?'找不到「'+esc(S.q)+'」':S.f==='todo'?'這裡都收完了 🎉':'沒有資料')+'</div>';
  renderSync()}
/* ===== 管理者統計 ===== */
function renderStats(){const R=S.rows,P=R.filter(paid),U=R.filter(r=>!paid(r));
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const big='<div class="card"><h3>全部 '+R.length+' 人</h3><div class="big"><div class="ok"><small>已收款（人）</small><b>'+P.length+'</b></div><div class="bad"><small>未收款（人）</small><b>'+U.length+'</b></div><div><small>收款率</small><b>'+pct(P.length,R.length)+'%</b></div>'+
    '<div class="ok"><small>已收金額</small><b>'+dueSum(P).toLocaleString('en-US')+'</b></div><div class="bad"><small>待收金額</small><b>'+dueSum(U).toLocaleString('en-US')+'</b></div><div><small>應收總額</small><b>'+dueSum(R).toLocaleString('en-US')+'</b></div></div></div>';
  const zrow=z=>{const a=R.filter(r=>r.z===z.id),p=a.filter(paid);return '<tr><td><b>'+z.id+'</b> '+esc(SHORT[z.id])+'<div class="bar"><i style="width:'+pct(p.length,a.length)+'%"></i></div></td><td class="num">'+a.length+'</td><td class="num" style="color:var(--okd)">'+p.length+'</td><td class="num" style="color:var(--badd)">'+(a.length-p.length)+'</td><td class="num">'+pct(p.length,a.length)+'%</td><td class="num">'+dueSum(p).toLocaleString('en-US')+'</td><td class="num">'+dueSum(a.filter(r=>!paid(r))).toLocaleString('en-US')+'</td></tr>'};
  const zt='<div class="card"><h3>各區</h3><div class="tblw"><table><tr><th>區域</th><th>人數</th><th>已收</th><th>未收</th><th>收款率</th><th>已收金額</th><th>待收金額</th></tr>'+ZONES.map(zrow).join('')+
    '<tr class="tot"><td>合計</td><td>'+R.length+'</td><td>'+P.length+'</td><td>'+U.length+'</td><td>'+pct(P.length,R.length)+'%</td><td>'+dueSum(P).toLocaleString('en-US')+'</td><td>'+dueSum(U).toLocaleString('en-US')+'</td></tr></table></div></div>';
  const byC={};R.forEach(r=>{const k=r.c||'?';(byC[k]=byC[k]||{z:r.z,a:0,p:0}).a++;if(paid(r))byC[k].p++});
  const ct='<div class="card"><h3>各國家／地區</h3><div class="tblw"><table><tr><th>國家</th><th>區</th><th>人數</th><th>已收</th><th>未收</th></tr>'+Object.entries(byC).sort((x,y)=>y[1].a-x[1].a).map(([k,v])=>'<tr><td>'+flag(k)+' '+esc(CN[k]||k)+'</td><td>'+v.z+'</td><td>'+v.a+'</td><td style="color:var(--okd)">'+v.p+'</td><td style="color:var(--badd)">'+(v.a-v.p)+'</td></tr>').join('')+'</table></div></div>';
  const byM={};R.forEach(r=>{const k=r.paym||'（未填）';(byM[k]=byM[k]||{a:0,p:0,da:0,dp:0}).a++;byM[k].da+=Number(r.due)||0;if(paid(r)){byM[k].p++;byM[k].dp+=Number(r.due)||0}});
  const mt='<div class="card"><h3>付款方式</h3><div class="tblw"><table><tr><th>方式</th><th>人數</th><th>已收</th><th>未收</th><th>已收金額</th><th>待收金額</th></tr>'+Object.entries(byM).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.a+'</td><td style="color:var(--okd)">'+v.p+'</td><td style="color:var(--badd)">'+(v.a-v.p)+'</td><td>'+v.dp.toLocaleString('en-US')+'</td><td>'+(v.da-v.dp).toLocaleString('en-US')+'</td></tr>').join('')+'</table></div></div>';
  const who={};R.filter(r=>r.by&&r.ts).forEach(r=>{const k=r.by.replace(/^收款（|）$/g,'');(who[k]=who[k]||{n:0,d:0}).n++;if(paid(r))who[k].d+=Number(r.due)||0});
  const wt=Object.keys(who).length?'<div class="card"><h3>現場收款紀錄（依收款人）</h3><div class="tblw"><table><tr><th>區域・收款人</th><th>操作人數</th><th>收到金額</th></tr>'+Object.entries(who).sort((x,y)=>y[1].n-x[1].n).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.n+'</td><td>'+v.d.toLocaleString('en-US')+'</td></tr>').join('')+'</table></div></div>':'';
  const recent=R.filter(r=>r.ts).sort((x,y)=>y.ts-x.ts).slice(0,25);
  const ft='<div class="card"><h3>最近的更新</h3>'+(recent.length?'<ul class="feed">'+recent.map(r=>'<li><time>'+esc(r.at)+'</time><span>'+r.z+'區 #'+r.n+' '+esc(r.name)+' → <b style="color:'+(paid(r)?'var(--okd)':'var(--badd)')+'">'+esc(payOf(r))+'</b>'+(r.by?' <small style="color:var(--muted)">'+esc(r.by.replace(/^收款（|）$/g,''))+'</small>':'')+'</span></li>').join('')+'</ul>':'<div style="color:var(--muted)">還沒有人在現場改過款項狀態</div>')+'</div>';
  $('#list').innerHTML=big+zt+mt+ct+wt+ft}
function renderSync(){const n=Object.keys(S.pend).length,e=$('#sync');e.className='sync'+(S.off?' off':n||S.busy?' busy':'');e.querySelector('span').textContent=S.off?('離線'+(n?'，'+n+' 筆待上傳':'')):n?n+' 筆上傳中':'已同步'}
/* ===== 點選 ===== */
function setPay(nos,pay){nos.forEach(no=>{const r=S.rows.find(x=>x.no===no);if(!r)return;if((r.pay||'')===pay)delete S.pend[no];else S.pend[no]=pay});LS.set('pend',{z:S.zone.id,p:S.pend});S.conf=null;render();try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}flushSoon()}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.pb');if(b){const no=b.dataset.no,r=S.rows.find(x=>x.no===no),p=payOf(r);
    if(p==='已收款'){if(S.conf===no){setPay([no],'未收款')}else{S.conf=no;render();clearTimeout(S.confT);S.confT=setTimeout(()=>{if(S.conf===no){S.conf=null;render()}},2500)}}else setPay([no],'已收款');return}
  const a=e.target.closest('[data-all]');if(a){const k=a.dataset.all;const nos=S.rows.filter(r=>r.reg===k&&!paid(r)).map(r=>r.no);setPay(nos,'已收款');toast(k+' 整筆 '+nos.length+' 人已收款')}});
$('#seg').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;S.f=b.dataset.f;LS.set('f',S.f);render();scrollTo(0,0)};
$('#zf').onclick=e=>{const b=e.target.closest('[data-zf]');if(!b)return;S.zf=+b.dataset.zf;render();scrollTo(0,0)};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;LS.set('tab',S.tab);render();scrollTo(0,0)};
$('#sortb').onclick=()=>{S.sort=S.sort==='table'?'n':'table';LS.set('sort',S.sort);render()};
$('#q').addEventListener('input',e=>{S.q=e.target.value;$('#qx').hidden=!S.q;render()});
$('#qx').onclick=()=>{S.q='';$('#q').value='';$('#qx').hidden=true;render();$('#q').focus()};
/* ===== 上傳與同步 ===== */
let flushT=null,backoff=1000;
function flushSoon(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms==null?300:ms)}
async function flush(){const ops=Object.entries(S.pend).map(([no,pay])=>({no,pay}));if(!ops.length||S.busy)return;S.busy=true;renderSync();
  try{const j=await call({op:'set',ops});ops.forEach(o=>{if(S.pend[o.no]===o.pay)delete S.pend[o.no]});LS.set('pend',{z:S.zone.id,p:S.pend});S.off=false;backoff=1000;S.busy=false;apply(j);if(Object.keys(S.pend).length)flushSoon()}
  catch(e){S.busy=false;if(e.server){toast(e.message);if(/密碼/.test(e.message)){LS.del('sess');setTimeout(()=>location.reload(),1500)}}S.off=!e.server;renderSync();backoff=Math.min(backoff*2,20000);flushSoon(backoff)}}
let pollT=null;
function startPoll(){clearInterval(pollT);pollT=setInterval(poll,POLL);setTimeout(poll,300)}
async function poll(){if(S.busy||document.hidden)return;if(Object.keys(S.pend).length){flush();return}
  try{const j=await call({op:'ver'});S.off=false;if(j.v!==S.v){const k=await call({op:'list'});if(!Object.keys(S.pend).length)apply(k)}else renderSync()}catch(e){if(!e.server){S.off=true;renderSync()}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.zone&&!$('#app').hidden)poll()});
addEventListener('online',()=>{S.off=false;flushSoon(0)});
addEventListener('beforeunload',e=>{if(Object.keys(S.pend).length){e.preventDefault();e.returnValue=''}});
/* ===== 示範資料 ===== */
let DB=null;
function demoApi(b){if(!DB){const names=['Alice Chen','Ben Wu','Cindy Lin','David Ho','Emma Sato','Frank Lee','Grace Kim','Henry Park','Ivy Tan','Jack Ng','王小明','林美玲','陳志豪','黃怡君','張家豪','李佳穎','吳俊傑','劉雅婷','蔡宗翰','楊淑芬'];DB=[];let n=1;const cs=['TW','JP','US','HK','KR'];
    for(let z=1;z<=5;z++)for(let i=0;i<8;i++){const sz=1+(i%3);const reg='TP'+String(z*100+i).padStart(3,'0');const pd=i%3===0;for(let j=0;j<sz;j++){DB.push({z,no:'D'+(n++),name:names[(i*3+j+z)%names.length],ig:'@demo_'+z+i+j,c:cs[z-1],reg,role:j?'攜伴':'本人',party:String(sz),t:z*5+i,pay:pd?'已收款':'未收款',due:j?'':String(1200*sz),paym:pd?'線上付款':'現場付款',id:String(n),at:'',ts:0,by:''})}}
    for(let z=1;z<=5;z++){const a=DB.filter(r=>r.z===z).sort((x,y)=>{const k=s=>[/^[a-z0-9]/i.test(s)?0:1,s.toLowerCase()];const p=k(x.name),q=k(y.name);return p[0]-q[0]||(p[1]<q[1]?-1:p[1]>q[1]?1:0)});a.forEach((r,i)=>r.n=i+1)}}
  return new Promise((ok,no)=>setTimeout(()=>{const want=b.z===0?'0714':String(b.z).repeat(4);if(String(b.p)!==want)return no(Object.assign(new Error('密碼不正確（示範：區號重複 4 次，管理者 0714）'),{server:true}));
    if(b.op==='set')b.ops.forEach(o=>{const r=DB.find(x=>x.no===o.no);if(r&&(b.z===0||r.z===b.z)){r.pay=o.pay;const d=new Date();r.at=String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+d.toTimeString().slice(0,5);r.ts=d.getTime();r.by='收款（'+(b.z?zname(b.z):'管理者')+(b.who?'・'+b.who:'')+'）'}});
    ok({ok:true,v:1,event:'示範晚宴',zone:b.z===0?ADMIN:ZONES[b.z-1],rows:JSON.parse(JSON.stringify(b.z===0?DB:DB.filter(r=>r.z===b.z)))})},200))}
/* ===== 啟動：記得上次登入就直接進去（先顯示手機上暫存的資料，再背景更新） ===== */
(function boot(){if(DEMO)$('#demoBar').hidden=false;renderZones();
  const s=LS.get('sess',null);if(!s)return;S.zone=s.z===0?ADMIN:ZONES.find(z=>z.id===s.z);if(!S.zone)return;S.pin=s.p;S.who=s.who||'';
  const pd=LS.get('pend',null);if(pd&&pd.z===S.zone.id)S.pend=pd.p||{};
  const c=LS.get('cache'+S.zone.id,null);if(c){S.rows=c.rows;S.v=c.v}
  enter(null);call({op:'list'}).then(j=>{if(!Object.keys(S.pend).length)apply(j);else{S.rows=j.rows;render();flushSoon(0)}}).catch(e=>{if(e.server){toast(e.message);LS.del('sess');setTimeout(()=>location.reload(),1500)}else{S.off=true;renderSync()}})})();
</script>
