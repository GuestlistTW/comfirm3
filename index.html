<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>現場收款</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--ink:#000;--ink2:rgba(60,60,67,.6);--ink3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --blue:#007aff;--green:#34c759;--greenT:#248a3d;--red:#ff3b30;--redT:#d70015;--orange:#ff9500;
  --z1:#007aff;--z2:#ff2d55;--z3:#30b0c7;--z4:#ff9500;--z5:#af52de;--z0:#8e8e93;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--ink:#fff;--ink2:rgba(235,235,245,.6);--ink3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.16);
  --blue:#0a84ff;--green:#30d158;--greenT:#30d158;--red:#ff453a;--redT:#ff6961;--orange:#ff9f0a;
  --z1:#0a84ff;--z2:#ff375f;--z3:#40c8e0;--z4:#ff9f0a;--z5:#bf5af2}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.demo{background:var(--orange);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:5px}

/* ---------- 登入 ---------- */
#login{min-height:100vh;padding:calc(56px + var(--st)) 0 40px}
.lg-h{text-align:center;margin-bottom:28px}
.lg-h small{color:var(--ink2);font-size:15px}
.lg-h h1{margin:6px 0 0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:28px}
.cap{font-size:13px;color:var(--ink2);text-transform:uppercase;margin:0 16px 7px}
.zb{display:flex;align-items:center;gap:14px;width:100%;padding:11px 16px;text-align:left;position:relative}
.zb+.zb::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--sep)}
.zb:active{background:var(--fill)}
.zi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;background:var(--c);flex:none}
.zb .zn{flex:1;font-size:17px}
.zb::after{content:"";width:8px;height:8px;border-top:2px solid var(--ink3);border-right:2px solid var(--ink3);transform:rotate(45deg);margin-right:4px}
.c1{--c:var(--z1)}.c2{--c:var(--z2)}.c3{--c:var(--z3)}.c4{--c:var(--z4)}.c5{--c:var(--z5)}.c0{--c:var(--z0)}

/* 密碼畫面 */
#pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(18px + var(--st)) 24px calc(24px + var(--sb))}
.pin-top{width:100%;max-width:340px}
.back{color:var(--blue);font-size:17px;padding:8px 0}
.pin-h{text-align:center;margin:18px 0 6px}
.pin-h .zi{width:52px;height:52px;border-radius:14px;font-size:24px;margin:0 auto 12px}
.pin-h b{display:block;font-size:22px;font-weight:600}
.pin-h small{display:block;color:var(--ink2);font-size:15px;margin-top:4px}
.dots{display:flex;justify-content:center;gap:20px;margin:22px 0 10px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.f{background:var(--ink)}
.dots.shake{animation:sh .38s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.err{color:var(--red);text-align:center;min-height:20px;font-size:14px;margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center}
.pad button{width:78px;height:78px;border-radius:50%;background:var(--fill);font-size:32px;font-weight:400;display:grid;place-items:center}
.pad button:active{background:var(--ink3)}
.pad button.k0{grid-column:2}
.pad button.del{background:none;font-size:17px;color:var(--ink)}
.who{display:block;width:100%;max-width:340px;margin:22px auto 0;padding:12px 14px;border-radius:10px;border:0;background:var(--card);font-size:16px;text-align:center}
.who::placeholder{color:var(--ink3)}

/* ---------- 主畫面 ---------- */
.top{padding:calc(10px + var(--st)) 0 6px}
.nav{display:flex;align-items:center;gap:14px;min-height:34px}
.nav .sp{flex:1}
.nb{color:var(--blue);font-size:17px}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync.busy i{background:var(--orange);animation:pl 1s infinite}.sync.off i{background:var(--red)}
@keyframes pl{50%{opacity:.25}}
.title{display:flex;align-items:center;gap:10px;margin:6px 0 0}
.title h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sum{margin:10px 0 2px}
.sum .t{display:flex;justify-content:space-between;font-size:15px;color:var(--ink2)}
.sum .t b{color:var(--ink);font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}

.bar{position:sticky;top:0;z-index:20;padding:8px 0 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
.bar.sh{box-shadow:0 .5px 0 var(--sep)}
.srow{display:flex;gap:10px;align-items:center}
.q{flex:1;position:relative}
.q svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink2)}
.q input{width:100%;height:36px;padding:0 30px 0 32px;border-radius:10px;border:0;background:var(--fill);font-size:17px;outline:none}
.q input::placeholder{color:var(--ink2)}
.q input::-webkit-search-cancel-button{display:none}
.q button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--ink3);color:var(--card);font-size:13px;line-height:20px}
.sortb{color:var(--blue);font-size:15px;white-space:nowrap}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
.seg button small{font-size:12px;color:var(--ink2);margin-left:4px;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:30px;padding:0 12px;border-radius:15px;background:var(--fill);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.chips button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chips button.on{background:var(--ink);color:var(--bg)}

main{padding:4px 0 calc(110px + var(--sb))}
.lst{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.no{width:28px;flex:none;text-align:right;font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums;align-self:flex-start;padding-top:2px}
.no .zd{display:block;margin:5px 0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--c)}
.nm{flex:1;min-width:0}
.nm .n1{font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.nm .n1 .f{font-weight:400;margin-right:6px}
.nm .ig{font-size:15px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.pend{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:6px;vertical-align:middle}
.grp{margin-top:6px;font-size:15px;color:var(--blue);display:inline-flex;align-items:center;gap:2px}
.grp::after{content:"";width:6px;height:6px;border-top:1.6px solid currentColor;border-right:1.6px solid currentColor;transform:rotate(45deg);margin-left:4px}
.tb{flex:none;width:46px;height:46px;border:1.5px solid var(--ink3);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tb b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.tb small{font-size:10px;color:var(--ink2);margin-top:3px}
.tb.na b{font-size:13px;font-weight:500;color:var(--ink2)}
.pb{flex:none;width:84px;height:36px;border-radius:18px;font-size:15px;font-weight:600;background:var(--fill);color:var(--redT);transition:transform .1s,background .2s}
.pb:active{transform:scale(.95)}
.pb.ok{background:var(--green);color:#fff}
.pb.conf{background:var(--orange);color:#fff;font-size:13px;line-height:1.15}
.pb.none{color:var(--ink2)}
.empty{text-align:center;color:var(--ink2);padding:60px 0;font-size:15px}
@media (max-width:370px){.pb{width:76px;font-size:14px}.tb{width:42px;height:42px}.row{gap:10px}}

/* 底部提示 */
.undo{position:fixed;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);z-index:40;width:min(520px,calc(100vw - 24px));background:rgba(44,44,46,.96);color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:up .22s ease-out}
.undo span{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;padding:8px 0}
.undo button{flex:none;color:#64d2ff;font-weight:600;font-size:16px;padding:10px 12px}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translateX(-50%);background:rgba(44,44,46,.96);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:70;max-width:calc(100vw - 32px);text-align:center}

/* 整筆確認 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--bg);width:min(600px,100vw);max-height:90vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sb);animation:sl .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateY(40%)}}
@media (min-width:700px){.mask{align-items:center}.sheet{border-radius:14px}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);margin:6px auto 0}
.sh-h{padding:14px 20px 12px;text-align:center}
.sh-h h3{margin:0;font-size:17px;font-weight:600}
.sh-h p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.sh-l{overflow:auto;margin:0 16px;background:var(--card);border-radius:12px}
.it{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left}
.it+.it::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:.5px solid var(--sep)}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;display:grid;place-items:center}
.it.on .ck{background:var(--green);border-color:var(--green)}
.it.on .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it.dis{cursor:default}
.it.dis .ck{border-color:transparent;background:var(--fill)}
.it .nm .n1{font-size:16px}
.it .amt{font-size:15px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.it .paid{font-size:14px;color:var(--greenT);white-space:nowrap}
.sh-t{display:flex;justify-content:space-between;align-items:baseline;margin:14px 20px 0;font-size:15px;color:var(--ink2)}
.sh-t b{font-size:22px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.sh-f{display:flex;gap:10px;padding:14px 16px 16px}
.sh-f button{flex:1;height:50px;border-radius:12px;font-weight:600;font-size:17px}
.sh-f .cx{background:var(--fill);color:var(--blue)}
.sh-f .go{background:var(--green);color:#fff;flex:2}
.sh-f .go:disabled{opacity:.35}

/* 管理者統計 */
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:22px}
.h3{font-size:13px;color:var(--ink2);text-transform:uppercase;margin:0 16px 7px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr)}
.kpi div{padding:4px 0}
.kpi div+div{border-left:.5px solid var(--sep);padding-left:14px}
.kpi small{display:block;font-size:13px;color:var(--ink2)}
.kpi b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .g{color:var(--greenT)}.kpi .r{color:var(--redT)}
.kpi+.kpi{border-top:.5px solid var(--sep);margin-top:12px;padding-top:12px}
.kpi.m b{font-size:19px}
.zrow{padding:10px 0;position:relative}
.zrow+.zrow{border-top:.5px solid var(--sep)}
.zrow .a{display:flex;align-items:center;gap:10px}
.zrow .a .zi{width:26px;height:26px;border-radius:7px;font-size:13px}
.zrow .a .zn{flex:1;font-weight:500}
.zrow .a b{font-variant-numeric:tabular-nums;font-weight:600}
.zrow .prog{margin:8px 0 6px 36px;height:5px}
.zrow .s{margin-left:36px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 0 9px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal}
th{font-size:12px;color:var(--ink2);font-weight:500;border-bottom:.5px solid var(--sep)}
td{border-bottom:.5px solid var(--sep)}tr:last-child td{border-bottom:0}
td.g{color:var(--greenT)}td.r{color:var(--redT)}
.tblw{overflow-x:auto}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;padding:10px 0;font-size:15px}
.feed li+li{border-top:.5px solid var(--sep)}
.feed time{color:var(--ink2);flex:none;font-size:13px;width:78px;padding-top:2px;font-variant-numeric:tabular-nums}
.feed span{flex:1;min-width:0}
.feed small{display:block;color:var(--ink2);font-size:13px}
.feed .g{color:var(--greenT)}.feed .r{color:var(--redT)}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>示範模式 · 資料是假的，不會寫入雲端</div>

<section id="login">
  <div class="wrap">
    <div class="lg-h"><small id="evName">晚宴</small><h1>現場收款</h1></div>
    <div class="cap">選擇區域</div>
    <div class="group" id="zones"></div>
    <div class="group" id="admz"></div>
  </div>
</section>

<section id="pin" hidden>
  <div class="pin-top"><button class="back" id="pinBack">‹ 返回</button></div>
  <div class="pin-h"><div class="zi" id="pinIcon"></div><b id="pinTtl"></b><small>輸入 4 位數密碼</small></div>
  <div class="dots" id="dots"></div>
  <div class="err" id="err"></div>
  <div class="pad" id="pad"></div>
  <input class="who" id="who" placeholder="你的名字（選填）" maxlength="20" autocomplete="off">
</section>

<section id="app" hidden>
  <div class="top"><div class="wrap">
    <div class="nav"><button class="nb" id="logout">‹ 登出</button><span class="sp"></span><span class="sync" id="sync"><i></i><span>已同步</span></span></div>
    <div class="title"><h1 id="zTitle"></h1></div>
    <div class="seg" id="tabs" hidden><button data-tab="stat">統計</button><button data-tab="list">名單</button></div>
    <div class="sum" id="sum"></div>
  </div></div>
  <div class="bar" id="bar"><div class="wrap">
    <div class="srow">
      <div class="q"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5.2"/><path d="m11 11 3.5 3.5"/></svg><input id="q" type="search" placeholder="編號、姓名、IG、桌號" autocomplete="off" enterkeyhint="search"><button id="qx" hidden aria-label="清除">✕</button></div>
      <button class="sortb" id="sortb"></button>
      <button class="nb" id="undoB" hidden aria-label="復原上一步">復原</button>
    </div>
    <div class="chips" id="zf" hidden></div>
    <div class="seg" id="seg"></div>
  </div></div>
  <main class="wrap" id="list"></main>
</section>

<div class="undo" id="undo" hidden><span id="undoT"></span><button id="undoGo">復原</button></div>
<div class="mask" id="mask" hidden><div class="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-h"><h3 id="shT"></h3><p id="shP">請核對名單，勾選的人會改成「已收款」</p></div>
  <div class="sh-l" id="shL"></div>
  <div class="sh-t" id="shTot"></div>
  <div class="sh-f"><button class="cx" id="shX">取消</button><button class="go" id="shGo">確認</button></div>
</div></div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
/* ===== 設定：Apps Script 部署網址（結尾是 /exec） ===== */
const API='https://script.google.com/macros/s/AKfycby0rorBPBH4beK8wfPxJ-v-fUYVUQA-2RYGyCe0YXC3CG85Fn5ouzq4zLqdL49iXbcJ/exec';
const ZONES=[{id:1,name:'台灣區'},{id:2,name:'日本區'},{id:3,name:'美洲與大洋洲區'},{id:4,name:'港星馬中（華語圈）'},{id:5,name:'韓國、歐洲與東南亞區'}];
const ADMIN={id:0,name:'管理者（全部區域）'};
const SHORT={1:'台灣',2:'日本',3:'美洲大洋洲',4:'港星馬中',5:'韓歐東南亞'};
const CN={TW:'台灣',JP:'日本',KR:'韓國',HK:'香港',CN:'中國',US:'美國',AU:'澳洲',SG:'新加坡',MY:'馬來西亞',TH:'泰國',PH:'菲律賓',ID:'印尼',VN:'越南',MO:'澳門',GB:'英國',UK:'英國',CA:'加拿大',FR:'法國',DE:'德國',ES:'西班牙',NL:'荷蘭',BR:'巴西',MN:'蒙古',NZ:'紐西蘭',CL:'智利',MX:'墨西哥',IN:'印度',IT:'義大利'};
const DEMO=/[?&]demo/.test(location.search);
const POLL=8000; // 每 8 秒檢查別人有沒有改資料
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('pay.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pay.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('pay.'+k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag=c=>{c=String(c||'').toUpperCase();if(c==='UK')c='GB';return /^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'🏳️'};
const money=n=>'NT$'+Number(n||0).toLocaleString('en-US');
const zname=id=>(ZONES.find(z=>z.id===id)||{}).name||'';
let S={hist:[],zone:null,pin:'',who:'',rows:[],v:0,f:LS.get('f','todo'),sort:LS.get('sort','n'),q:'',zf:0,tab:LS.get('tab','stat'),pend:{},conf:null,busy:false,off:false};
const isAdmin=()=>S.zone&&S.zone.id===0;

/* ===== 上傳與同步 ===== */
let flushT=null,backoff=1000;
function flushSoon(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms==null?300:ms)}
async function flush(){const ops=Object.entries(S.pend).map(([no,pay])=>({no,pay}));if(!ops.length||S.busy)return;S.busy=true;renderSync();
  try{const j=await call({op:'set',ops});S.busy=false;S.off=false;backoff=1000;
    // 只有雲端回傳的資料「真的」等於手機上想要的狀態才算完成；期間若按了復原／又改了，會留著再送一次
    const by={};(j.rows||[]).forEach(r=>by[r.no]=r);
    Object.keys(S.pend).forEach(no=>{const r=by[no];if(!r){delete S.pend[no];return}if((r.pay||'')===S.pend[no])delete S.pend[no]});
    LS.set('pend',{z:S.zone.id,p:S.pend});apply(j);if(Object.keys(S.pend).length)flushSoon(0)}
  catch(e){S.busy=false;if(e.server&&!/其他人正在儲存/.test(e.message)){toast(e.message);if(/密碼/.test(e.message)){LS.del('sess');setTimeout(()=>location.reload(),1500)}}S.off=!e.server;if(/其他人正在儲存/.test(e.message))S.off=false;renderSync();backoff=Math.min(backoff*2,20000);flushSoon(backoff)}}
let pollT=null;
function startPoll(){clearInterval(pollT);pollT=setInterval(poll,POLL);setTimeout(poll,300)}
async function poll(){if(S.busy||document.hidden)return;if(Object.keys(S.pend).length){flush();return}
  try{const j=await call({op:'ver'});S.off=false;if(j.v!==S.v){const k=await call({op:'list'});if(!Object.keys(S.pend).length&&!S.busy)apply(k)}else renderSync()}catch(e){if(!e.server){S.off=true;renderSync()}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.zone&&!$('#app').hidden)poll()});
addEventListener('online',()=>{S.off=false;flushSoon(0)});
addEventListener('beforeunload',e=>{if(Object.keys(S.pend).length){e.preventDefault();e.returnValue=''}});

    for(let z=1;z<=5;z++){const a=DB.filter(r=>r.z===z).sort((x,y)=>{const k=s=>[/^[a-z0-9]/i.test(s)?0:1,s.toLowerCase()];const p=k(x.name),q=k(y.name);return p[0]-q[0]||(p[1]<q[1]?-1:p[1]>q[1]?1:0)});a.forEach((r,i)=>r.n=i+1)}}
  return new Promise((ok,no)=>setTimeout(()=>{const want=b.z===0?'0714':String(b.z).repeat(4);if(String(b.p)!==want)return no(Object.assign(new Error('密碼不正確（示範：區號重複 4 次，管理者 0714）'),{server:true}));
    if(b.op==='set')b.ops.forEach(o=>{const r=DB.find(x=>x.no===o.no);if(r&&(b.z===0||r.z===b.z)){r.pay=o.pay;const d=new Date();r.at=String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+d.toTimeString().slice(0,5);r.ts=d.getTime();r.by='收款（'+(b.z?zname(b.z):'管理者')+(b.who?'・'+b.who:'')+'）'}});
    ok({ok:true,v:1,event:'示範晚宴',zone:b.z===0?ADMIN:ZONES[b.z-1],rows:JSON.parse(JSON.stringify(b.z===0?DB:DB.filter(r=>r.z===b.z)))})},200))}
/* ===== 啟動：記得上次登入就直接進去（先顯示手機上暫存的資料，再背景更新） ===== */
(function boot(){if(DEMO)$('#demoBar').hidden=false;renderZones();
  const s=LS.get('sess',null);if(!s)return;S.zone=s.z===0?ADMIN:ZONES.find(z=>z.id===s.z);if(!S.zone)return;S.pin=s.p;S.who=s.who||'';
  const pd=LS.get('pend',null);if(pd&&pd.z===S.zone.id)S.pend=pd.p||{};
  const c=LS.get('cache'+S.zone.id,null);if(c){S.rows=c.rows;S.v=c.v}
  enter(null);call({op:'list'}).then(j=>{if(!Object.keys(S.pend).length)apply(j);else{S.rows=j.rows;render();flushSoon(0)}}).catch(e=>{if(e.server){toast(e.message);LS.del('sess');setTimeout(()=>location.reload(),1500)}else{S.off=true;renderSync()}})})();
</script>
