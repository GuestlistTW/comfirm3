<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="robots" content="noindex,nofollow">
<title>現場收款</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--ink2:#3a3a3c;--muted:#8e8e93;--hair:rgba(60,60,67,.14);--accent:#007aff;--ok:#34c759;--okd:#248a3d;--bad:#ff3b30;--badd:#d70015;--warn:#ff9500;--fill:rgba(120,120,128,.12);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--ink2:#ebebf5;--muted:#8e8e93;--hair:rgba(84,84,88,.6);--accent:#0a84ff;--ok:#30d158;--okd:#30d158;--bad:#ff453a;--badd:#ff6961;--fill:rgba(120,120,128,.24)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
.num{font-variant-numeric:tabular-nums}
/* 登入 */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + var(--safe-t)) 16px 24px}
.lg-h{text-align:center;margin-bottom:22px}.lg-h small{color:var(--muted);font-size:14px}.lg-h h1{margin:4px 0 0;font-size:30px;letter-spacing:.5px}
.zones{display:grid;gap:10px;max-width:440px;margin:0 auto;width:100%}
.zb{background:var(--card);border-radius:16px;padding:15px 18px;text-align:left;display:flex;align-items:center;gap:14px;box-shadow:0 1px 0 var(--hair)}
.zb b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--c,var(--accent));color:#fff;font-size:18px;flex:none}
.zb span{font-size:17px;font-weight:600}.zb.on{outline:3px solid var(--c,var(--accent))}
.zb.adm{margin-top:6px}.zb.adm b{background:#1c1c1e}@media (prefers-color-scheme:dark){.zb.adm b{background:#636366}}
.pin{max-width:440px;margin:18px auto 0;width:100%;background:var(--card);border-radius:18px;padding:16px}
.pin .ttl{text-align:center;font-weight:600}.dots{display:flex;justify-content:center;gap:14px;margin:14px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.dots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:14px;background:var(--fill);font-size:24px;font-weight:600}
.pad button:active{background:var(--hair)}
.who{display:block;width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--bg);color:var(--ink);font:inherit}
.err{color:var(--bad);text-align:center;min-height:22px;margin-top:8px;font-size:14px}
/* 主畫面 */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);padding:calc(8px + var(--safe-t)) 0 8px;border-bottom:1px solid var(--hair)}
.hr{display:flex;align-items:center;gap:10px}.hr h2{margin:0;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:var(--warn);animation:pl 1s infinite}.sync.off i{background:var(--bad)}@keyframes pl{50%{opacity:.3}}
.out{font-size:14px;color:var(--accent);padding:6px 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.st{background:var(--card);border-radius:12px;padding:7px 9px;min-width:0}.st small{display:block;font-size:11.5px;color:var(--muted)}.st b{font-size:17px;font-variant-numeric:tabular-nums}
.st.ok b{color:var(--okd)}.st.bad b{color:var(--badd)}
.tools{display:flex;gap:8px;margin-top:8px;align-items:center}
.q{flex:1;position:relative}.q input{width:100%;padding:10px 34px 10px 12px;border-radius:12px;border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:16px}
.q button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:14px;color:var(--muted);font-size:18px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-top:8px;overflow-x:auto}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
.sortb{font-size:13px;color:var(--accent);white-space:nowrap;padding:8px 4px}
main{padding:10px 0 calc(40px + var(--safe-b))}
.lst{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;column-gap:9px;align-items:center;padding:12px 12px 12px 10px;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row.isok{background:color-mix(in srgb,var(--ok) 7%,var(--card))}
.lft{display:flex;flex-direction:column;align-items:center;gap:3px;align-self:start;min-width:40px}
.no{font-size:16px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums;background:var(--fill);border-radius:9px;padding:2px 7px;min-width:36px;text-align:center}
.zt{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:0 5px}
.fl{font-size:24px;line-height:1}
.nm{min-width:0}
.nm b{display:block;font-size:17.5px;line-height:1.25;overflow-wrap:anywhere}
.ig{display:block;font-size:15px;color:var(--accent);margin-top:2px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px}
.meta span{font-size:12.5px;color:var(--ink2);background:var(--fill);border-radius:7px;padding:1px 7px;white-space:nowrap}
.meta span.due{color:var(--badd);font-weight:700}.meta span.tm{color:var(--okd)}
.grp{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:13.5px;color:var(--accent);font-weight:700;border:1.5px solid var(--accent);border-radius:9px;padding:4px 10px}
.pb{min-width:92px;height:46px;border-radius:13px;font-weight:700;font-size:15px;border:2px solid var(--bad);color:var(--badd);background:transparent;transition:transform .08s;align-self:center}
.pb:active{transform:scale(.96)}
.pb.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pb.conf{background:var(--warn);border-color:var(--warn);color:#fff;font-size:13px;line-height:1.2}
.pb.none{border-color:var(--muted);color:var(--muted)}
.pend{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
@media (max-width:400px){.pb{min-width:80px;font-size:14px}.nm b{font-size:16.5px}.tb{width:50px}.tb b{font-size:19px}.row{padding-right:8px}}
/* 復原列 */
.undo{position:fixed;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);z-index:40;width:min(560px,calc(100vw - 24px));background:rgba(28,28,30,.94);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.undo span{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.undo button{flex:none;background:#fff;color:#1c1c1e;font-weight:800;border-radius:11px;padding:9px 14px;font-size:15px}
.undob{font-size:14px;color:var(--accent);padding:6px 4px;white-space:nowrap}
/* 整筆確認 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(620px,100vw);max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
@media (min-width:700px){.mask{align-items:center}.sheet{border-radius:20px}}
.sh-h{padding:16px 16px 8px}.sh-h h3{margin:0;font-size:19px}.sh-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sh-l{overflow:auto;padding:0 12px}
.sh-l label{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--card);padding:11px 12px;border-bottom:1px solid var(--hair)}
.sh-l label:first-child{border-radius:14px 14px 0 0}.sh-l label:last-child{border-radius:0 0 14px 14px;border-bottom:0}.sh-l label:only-child{border-radius:14px}
.sh-l input{width:22px;height:22px;accent-color:var(--ok)}
.sh-l b{display:block;font-size:16.5px;overflow-wrap:anywhere}.sh-l small{display:block;color:var(--accent);font-size:14px;overflow-wrap:anywhere}
.sh-l .st2{font-size:13px;font-weight:700;white-space:nowrap}.st2.y{color:var(--okd)}.st2.n{color:var(--badd)}
.sh-f{display:flex;gap:10px;padding:14px 12px 16px}
.sh-f button{flex:1;height:52px;border-radius:14px;font-weight:800;font-size:16.5px}
.sh-f .cx{background:var(--fill)}.sh-f .go{background:var(--ok);color:#fff;flex:2}.sh-f .go:disabled{opacity:.4}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.demo{background:var(--warn);color:#fff;text-align:center;font-size:12.5px;padding:4px}
/* 統計 */
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big div{background:var(--fill);border-radius:12px;padding:9px 10px}.big small{display:block;color:var(--muted);font-size:12px}.big b{font-size:20px;font-variant-numeric:tabular-nums}
.big .ok b{color:var(--okd)}.big .bad b{color:var(--badd)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600}tr.tot td{font-weight:800;border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:4px;min-width:60px}.bar i{display:block;height:100%;background:var(--ok)}
.tblw{overflow-x:auto}
.feed{list-style:none;margin:0;padding:0;font-size:14px}.feed li{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--hair)}.feed li:last-child{border-bottom:0}
.feed time{color:var(--muted);flex:none;width:86px;font-variant-numeric:tabular-nums}.feed span{flex:1;min-width:0}
[hidden]{display:none!important}
/* 區域顏色 */
:root{--z1:#007aff;--z2:#e8335a;--z3:#13a38b;--z4:#f08a00;--z5:#8e44d9;--z0:#3a3a3c;--zc:var(--accent)}
@media (prefers-color-scheme:dark){:root{--z1:#0a84ff;--z2:#ff5c7f;--z3:#30d1b4;--z4:#ffa229;--z5:#b37bff;--z0:#8e8e93}}
.c1{--c:var(--z1)}.c2{--c:var(--z2)}.c3{--c:var(--z3)}.c4{--c:var(--z4)}.c5{--c:var(--z5)}.c0{--c:var(--z0)}
header{border-top:4px solid var(--zc)}
.hr h2{color:var(--zc)}
.st{border-top:3px solid var(--hair)}.st.ok{border-top-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card))}.st.bad{border-top-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}.st.mo{border-top-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--card))}.st.mo b{color:#c26a00}
@media (prefers-color-scheme:dark){.st.mo b{color:#ffb340}}
.seg#seg button.on[data-f=todo]{color:var(--badd)}.seg#seg button.on[data-f=done]{color:var(--okd)}
.no{background:color-mix(in srgb,var(--c,var(--zc)) 14%,var(--card));color:var(--c,var(--zc))}
.zt{background:var(--c,var(--accent))}
.row{border-left:4px solid transparent}.row.isok{border-left-color:var(--ok)}.row:not(.isok){border-left-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.tb{flex:none;width:58px;min-height:50px;border:2.5px solid var(--c,var(--zc));border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c,var(--zc));background:color-mix(in srgb,var(--c,var(--zc)) 8%,var(--card));line-height:1}
.tb b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.tb small{font-size:11px;font-weight:700;margin-top:3px}
.tb.na{border-color:var(--muted);color:var(--muted);background:var(--fill)}.tb.na b{font-size:15px}
.due2{display:inline-block;margin-top:5px;font-size:13.5px;font-weight:800;color:#c26a00;background:color-mix(in srgb,var(--warn) 15%,var(--card));border-radius:8px;padding:2px 8px}
@media (prefers-color-scheme:dark){.due2{color:#ffb340}}
.tm2{display:inline-block;margin:5px 0 0 6px;font-size:12.5px;color:var(--okd);font-weight:600}
.rgt{display:flex;align-items:center;gap:8px}
.sh-l .tb{width:50px;min-height:44px}.sh-l .tb b{font-size:19px}

</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>示範模式：資料是假的，不會寫入雲端</div>
<section id="login">
  <div class="lg-h"><small id="evName">晚宴</small><h1>現場收款</h1></div>
  <div class="zones" id="zones"></div>
  <div class="pin" id="pinBox" hidden>
    <div class="ttl" id="pinTtl">請輸入密碼</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad"></div>
    <input class="who" id="who" placeholder="你的名字（選填，會記在紀錄裡）" maxlength="20" autocomplete="off">
    <div class="err" id="err"></div>
  </div>
</section>
<section id="app" hidden>
  <header><div class="wrap">
    <div class="hr"><h2 id="zTitle"></h2><span class="sync" id="sync"><i></i><span>已同步</span></span><button class="undob" id="undoB" hidden>↶ 上一步</button><button class="out" id="logout">登出</button></div>
    <div class="seg" id="tabs" hidden><button data-tab="stat">統計</button><button data-tab="list">名單</button></div>
    <div id="listTools">
      <div class="stats" id="stats"></div>
      <div class="seg" id="zf" hidden></div>
      <div class="tools"><div class="q"><input id="q" type="search" placeholder="搜尋編號、姓名、IG、桌號" autocomplete="off" enterkeyhint="search"><button id="qx" hidden aria-label="清除">×</button></div><button class="sortb" id="sortb"></button></div>
      <div class="seg" id="seg"><button data-f="todo">未收款</button><button data-f="done">已收款</button><button data-f="all">全部</button></div>
    </div>
  </div></header>
  <main class="wrap" id="list"></main>
</section>
<div class="undo" id="undo" hidden><span id="undoT"></span><button id="undoGo">復原</button></div>
<div class="mask" id="mask" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="sh-h"><h3 id="shT"></h3><p id="shP"></p></div><div class="sh-l" id="shL"></div><div class="sh-f"><button class="cx" id="shX">取消</button><button class="go" id="shGo">確認</button></div></div></div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
/* ===== 設定：Apps Script 部署網址（結尾是 /exec） ===== */
const API='https://script.google.com/macros/s/AKfycby0rorBPBH4beK8wfPxJ-v-fUYVUQA-2RYGyCe0YXC3CG85Fn5ouzq4zLqdL49iXbcJ/exec';
const ZONES=[{id:1,name:'台灣區'},{id:2,name:'日本區'},{id:3,name:'美洲與大洋洲區'},{id:4,name:'港星馬中（華語圈）'},{id:5,name:'韓國、歐洲與東南亞區'}];
const ADMIN={id:0,name:'管理者（全部區域）'};
const SHORT={1:'台灣',2:'日本',3:'美洲大洋洲',4:'港星馬中',5:'韓歐東南亞'};
const CN={TW:'台灣',JP:'日本',KR:'韓國',HK:'香港',CN:'中國',US:'美國',AU:'澳洲',SG:'新加坡',MY:'馬來西亞',TH:'泰國',PH:'菲律賓',ID:'印尼',VN:'越南',MO:'澳門',GB:'英國',UK:'英國',CA:'加拿大',FR:'法國',DE:'德國',ES:'西班牙',NL:'荷蘭',BR:'巴西',MN:'蒙古',NZ:'紐西蘭',CL:'智利',MX:'墨西哥',IN:'印度',IT:'義大利'};
const DEMO=/[?&]demo/.test(location.search);
const POLL=8000; // 每 8 秒檢查別人有沒有改資料
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('pay.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pay.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('pay.'+k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag=c=>{c=String(c||'').toUpperCase();if(c==='UK')c='GB';return /^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'🏳️'};
const money=n=>'NT$'+Number(n||0).toLocaleString('en-US');
const zname=id=>(ZONES.find(z=>z.id===id)||{}).name||'';
let S={hist:[],zone:null,pin:'',who:'',rows:[],v:0,f:LS.get('f','todo'),sort:LS.get('sort','n'),q:'',zf:0,tab:LS.get('tab','stat'),pend:{},conf:null,busy:false,off:false};
const isAdmin=()=>S.zone&&S.zone.id===0;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
/* ===== 呼叫雲端 ===== */
async function call(body){
  const payload=Object.assign({api:'pay',z:S.zone.id,p:S.pin,who:S.who},body);
  if(DEMO)return demoApi(payload);
  const r=await fetch(API,{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error('連線失敗（'+r.status+'）');const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.error||'失敗'),{server:true});return j}
/* ===== 登入 ===== */
function renderZones(){$('#zones').innerHTML=ZONES.map(z=>'<button class="zb c'+z.id+(S.zone&&S.zone.id===z.id?' on':'')+'" data-z="'+z.id+'"><b>'+z.id+'</b><span>'+esc(z.name)+'</span></button>').join('')+
  '<button class="zb adm c0'+(S.zone&&S.zone.id===0?' on':'')+'" data-z="0"><b>★</b><span>管理者（全部區域與統計）</span></button>'}
let pinBuf='';
function renderPin(){$('#dots').innerHTML=[0,1,2,3].map(i=>'<i'+(i<pinBuf.length?' class="f"':'')+'></i>').join('')}
$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?'<button data-k="'+k+'">'+k+'</button>':'<span></span>').join('');
$('#zones').onclick=e=>{const b=e.target.closest('[data-z]');if(!b)return;const id=+b.dataset.z;S.zone=id===0?ADMIN:ZONES.find(z=>z.id===id);pinBuf='';renderZones();renderPin();$('#pinBox').hidden=false;$('#pinTtl').textContent=S.zone.name+'：請輸入密碼';$('#err').textContent='';$('#who').value=LS.get('who','');$('#pinBox').scrollIntoView({behavior:'smooth',block:'nearest'})};
$('#pad').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;renderPin();if(pinBuf.length===4)tryLogin(pinBuf)};
async function tryLogin(pin){S.pin=pin;S.who=$('#who').value.trim();LS.set('who',S.who);$('#err').textContent='登入中…';

  enter(null);call({op:'list'}).then(j=>{if(!Object.keys(S.pend).length)apply(j);else{S.rows=j.rows;render();flushSoon(0)}}).catch(e=>{if(e.server){toast(e.message);LS.del('sess');setTimeout(()=>location.reload(),1500)}else{S.off=true;renderSync()}})})();
</script>
</body>
